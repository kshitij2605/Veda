version: '3.8'

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: veda
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-vedapassword}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring
    volumes:
      - nats-data:/data

  veda:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6340:6340"
    volumes:
      - veda-data:/var/veda/data
    environment:
      RUST_LOG: info
      VEDA_STORAGE_ENDPOINT: minio:9000
      VEDA_STORAGE_ACCESS_KEY: veda
      VEDA_STORAGE_SECRET_KEY: ${MINIO_PASSWORD:-vedapassword}
      VEDA_MQ_ENDPOINT: nats:4222
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_started

  # --- OCR Services (optional, enabled with --profile ocr) ---
  flashparse:
    profiles: ["ocr"]
    image: ghcr.io/kshitij2605/flashparse:latest
    build:
      context: .
      dockerfile: Dockerfile.flashparse
    ports:
      - "8000:8000"
    environment:
      VLM_ENDPOINT: ${VLM_ENDPOINT:-http://host.docker.internal:8008/v1/chat/completions}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-}
      GLMOCR_CONFIG_PATH: /app/glmocr_config.yaml
    volumes:
      - flashparse-data:/tmp/flashparse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Embedding Service (optional, enabled with --profile embedding) ---
  embedding:
    profiles: ["embedding"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    ports:
      - "8090:80"
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - embedding-model-cache:/data
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-m3}", "--port", "80"]

volumes:
  minio-data:
  nats-data:
  veda-data:
  flashparse-data:
  embedding-model-cache:
