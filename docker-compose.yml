version: '3.8'

# Top-level anchor so the 3 raft-cluster services can share most of
# their env (everything except VEDA_NODE_ID / VEDA_NODE_ADDRESS).
x-raft-env: &raft-env
  RUST_LOG: "info,openraft=info,veda_coordinator=debug"
  VEDA_STORAGE_ENDPOINT: "minio:9000"
  VEDA_STORAGE_ACCESS_KEY: "veda"
  VEDA_STORAGE_SECRET_KEY: "${MINIO_PASSWORD:-vedapassword}"
  VEDA_MQ_ENDPOINT: "nats:4222"
  VEDA_BLOB_BACKEND: "minio"
  VEDA_BLOB_ENDPOINT: "http://minio:9000"
  VEDA_BLOB_BUCKET: "veda-blobs"
  VEDA_BLOB_ACCESS_KEY: "veda"
  VEDA_BLOB_SECRET_KEY: "${MINIO_PASSWORD:-vedapassword}"
  VEDA_COORDINATOR: "raft"
  VEDA_RAFT_PEERS: "1@veda-1:6341,2@veda-2:6341,3@veda-3:6341"
  VEDA_RAFT_LISTEN: "0.0.0.0:6341"
  VEDA_RAFT_BOOTSTRAP: "1"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: veda
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-vedapassword}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring
    volumes:
      - nats-data:/data

  veda:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6340:6340"
    volumes:
      - veda-data:/var/veda/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      VEDA_STORAGE_ENDPOINT: minio:9000
      VEDA_STORAGE_ACCESS_KEY: veda
      VEDA_STORAGE_SECRET_KEY: ${MINIO_PASSWORD:-vedapassword}
      VEDA_MQ_ENDPOINT: nats:4222
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      VEDA_FLASHPARSE_ENDPOINT: ${VEDA_FLASHPARSE_ENDPOINT:-http://flashparse:8000}
      # Web ingestion (crawl4ai). Unset by default = /ingest-url returns
      # 503 cleanly. Enable with: docker compose --profile web up, then set
      # VEDA_CRAWL4AI_ENDPOINT=http://crawl4ai:11235 (e.g. in .env).
      VEDA_CRAWL4AI_ENDPOINT: ${VEDA_CRAWL4AI_ENDPOINT:-}
      VEDA_CRAWL4AI_TOKEN: ${VEDA_CRAWL4AI_TOKEN:-}
      # Agentic web search (searxng). Unset by default = the web_search
      # agent tool returns "not configured" cleanly. Enable with the same
      # --profile web, then set VEDA_SEARXNG_ENDPOINT=http://searxng:8080.
      VEDA_SEARXNG_ENDPOINT: ${VEDA_SEARXNG_ENDPOINT:-}
      VEDA_SEARXNG_TOKEN: ${VEDA_SEARXNG_TOKEN:-}
      VEDA_BLOB_BACKEND: minio
      VEDA_BLOB_ENDPOINT: http://minio:9000
      VEDA_BLOB_BUCKET: veda-blobs
      VEDA_BLOB_ACCESS_KEY: veda
      VEDA_BLOB_SECRET_KEY: ${MINIO_PASSWORD:-vedapassword}
      MULTIMODAL_EMBEDDING_ENDPOINT: ${MULTIMODAL_EMBEDDING_ENDPOINT:-http://multimodal-embedding:8000}
      MULTIMODAL_EMBEDDING_MODEL: ${MULTIMODAL_EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      MULTIMODAL_EMBEDDING_DIMENSION: ${MULTIMODAL_EMBEDDING_DIMENSION:-2048}
      # OpenAI-compatible LLM endpoint (used by /v1/llm/complete and
      # the dashboard's cluster-labels / NL→DSL / failure classifier).
      # Unset = LLM-backed UI affordances hide cleanly.
      VEDA_LLM_ENDPOINT: ${VEDA_LLM_ENDPOINT:-}
      VEDA_LLM_API_KEY: ${VEDA_LLM_API_KEY:-}
      VEDA_LLM_MODEL: ${VEDA_LLM_MODEL:-}
      # Phase 6.4 / Raft migration: set VEDA_COORDINATOR=raft to
      # boot a single-node openraft loop. The dashboard's Cluster
      # Nodes table then reports mode="raft". Unset = legacy
      # single-process consensus.
      VEDA_COORDINATOR: ${VEDA_COORDINATOR:-}
      VEDA_NODE_ID: ${VEDA_NODE_ID:-}
      VEDA_NODE_ADDRESS: ${VEDA_NODE_ADDRESS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-veda}
      NO_PROXY: localhost,127.0.0.1,minio,nats,embedding,multimodal-embedding,flashparse,vlm,glm-ocr,crawl4ai,searxng
      no_proxy: localhost,127.0.0.1,minio,nats,embedding,multimodal-embedding,flashparse,vlm,glm-ocr,crawl4ai,searxng
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_started

  # --- 3-node Raft cluster (optional, enabled with --profile raft-cluster) ---
  #
  # Spins up three Veda processes that form a real openraft quorum
  # over Tonic gRPC. They share MinIO and NATS with the default `veda`
  # service so collection data still lands somewhere durable.
  #
  # Usage:
  #   docker compose --profile raft-cluster up -d veda-1 veda-2 veda-3
  # Then on the host:
  #   curl http://localhost:6340/v1/admin/nodes  # node-1
  #   curl http://localhost:6342/v1/admin/nodes  # node-2
  #   curl http://localhost:6344/v1/admin/nodes  # node-3
  veda-1:
    profiles: ["raft-cluster"]
    build:
      context: .
      dockerfile: Dockerfile
    image: project-mdb-veda
    ports:
      - "6340:6340"
    volumes:
      - veda-1-data:/var/veda/data
    environment:
      <<: *raft-env
      VEDA_NODE_ID: "1"
      VEDA_NODE_ADDRESS: "veda-1:6340"
    # NET_ADMIN lets `tc qdisc` inside the container introduce
    # packet loss / latency on the eth0 interface — needed by the
    # fault-injection harness in scripts/raft-fault-inject.sh.
    cap_add: ["NET_ADMIN"]
    depends_on:
      minio: { condition: service_healthy }
      nats:  { condition: service_started }

  veda-2:
    profiles: ["raft-cluster"]
    image: project-mdb-veda
    ports:
      - "6342:6340"
    volumes:
      - veda-2-data:/var/veda/data
    environment:
      <<: *raft-env
      VEDA_NODE_ID: "2"
      VEDA_NODE_ADDRESS: "veda-2:6340"
    cap_add: ["NET_ADMIN"]
    depends_on:
      veda-1: { condition: service_started }

  veda-3:
    profiles: ["raft-cluster"]
    image: project-mdb-veda
    ports:
      - "6344:6340"
    volumes:
      - veda-3-data:/var/veda/data
    environment:
      <<: *raft-env
      VEDA_NODE_ID: "3"
      VEDA_NODE_ADDRESS: "veda-3:6340"
    cap_add: ["NET_ADMIN"]
    depends_on:
      veda-1: { condition: service_started }

  # --- OCR Services (optional, enabled with --profile ocr) ---
  flashparse:
    profiles: ["ocr"]
    image: ghcr.io/kshitij2605/flashparse:latest
    build:
      context: .
      dockerfile: Dockerfile.flashparse
    ports:
      - "8000:8000"
    environment:
      VLM_ENDPOINT: ${VLM_ENDPOINT:-http://vlm:8008/v1/chat/completions}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen3.5-2B}
      GLMOCR_CONFIG_PATH: /app/glmocr_config.yaml
      GLMOCR_API_HOST: ${GLMOCR_API_HOST:-glm-ocr}
      GLMOCR_API_PORT: ${GLMOCR_API_PORT:-8080}
      NO_PROXY: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse
      no_proxy: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse
    volumes:
      - flashparse-data:/tmp/flashparse
      - ./config/glmocr_config.yaml:/app/glmocr_config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Web ingestion (optional, enabled with --profile web) ---
  #
  # crawl4ai turns a URL into clean markdown for the /v1/collections/{name}/
  # ingest-url connector. Opt-in: the core `veda` service leaves
  # VEDA_CRAWL4AI_ENDPOINT empty, so /ingest-url returns 503 until you run
  # this profile and point Veda at it:
  #
  #   docker compose --profile web up -d crawl4ai
  #   VEDA_CRAWL4AI_ENDPOINT=http://crawl4ai:11235 docker compose up -d veda
  crawl4ai:
    profiles: ["web"]
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    environment:
      # Optional shared-secret; mirror it into VEDA_CRAWL4AI_TOKEN on `veda`.
      CRAWL4AI_API_TOKEN: ${VEDA_CRAWL4AI_TOKEN:-}
      NO_PROXY: localhost,127.0.0.1,minio,nats,veda
      no_proxy: localhost,127.0.0.1,minio,nats,veda
    # crawl4ai launches headless Chromium, which needs a larger /dev/shm.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:11235/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # searxng powers the `web_search` agent tool: a privacy-respecting
  # metasearch instance queried via its JSON API. Opt-in alongside
  # crawl4ai under the same --profile web; the core `veda` service leaves
  # VEDA_SEARXNG_ENDPOINT empty until you run this and point Veda at it:
  #
  #   docker compose --profile web up -d searxng
  #   VEDA_SEARXNG_ENDPOINT=http://searxng:8080 docker compose up -d veda
  #
  # The JSON API (`/search?format=json`) is enabled by the mounted
  # config/searxng/settings.yml, which sets `search.formats: [html, json]`
  # (the stock image ships HTML-only).
  searxng:
    profiles: ["web"]
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      # Public base URL searxng advertises; harmless for internal use.
      SEARXNG_BASE_URL: ${VEDA_SEARXNG_ENDPOINT:-http://searxng:8080}
      NO_PROXY: localhost,127.0.0.1,minio,nats,veda
      no_proxy: localhost,127.0.0.1,minio,nats,veda
    volumes:
      # Mount our minimal settings (JSON format enabled) read-only.
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-proxy", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Embedding Service (optional, enabled with --profile embedding) ---
  embedding:
    profiles: ["embedding"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    ports:
      - "8092:80"
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - embedding-model-cache:/data
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-m3}", "--port", "80"]

  # --- Multimodal Embedding Service (optional, enabled with --profile embedding) ---
  # Qwen3-VL-Embedding-2B served via vLLM for image/video embedding.
  # Default: Qwen/Qwen3-VL-Embedding-2B (~4GB GPU VRAM).
  # Users can substitute any vLLM-compatible multimodal embedding model.
  multimodal-embedding:
    profiles: ["embedding"]
    image: vllm/vllm-openai:nightly
    ports:
      - "8094:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${MULTIMODAL_EMBEDDING_GPU:-3}
      NO_PROXY: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse,embedding,multimodal-embedding
      no_proxy: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse,embedding,multimodal-embedding
    volumes:
      - multimodal-embedding-model-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${MULTIMODAL_EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}"
      - "--runner"
      - "pooling"
      - "--port"
      - "8000"
      - "--served-model-name"
      - "${MULTIMODAL_EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}"
      - "--gpu-memory-utilization"
      - "${MULTIMODAL_EMBEDDING_GPU_UTIL:-0.50}"
      - "--trust-remote-code"
      - "--max-model-len"
      - "${MULTIMODAL_EMBEDDING_MAX_MODEL_LEN:-8192}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MULTIMODAL_EMBEDDING_GPU:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  # --- VLM Service (starts with --profile ocr-vlm) ---
  # Used by FlashParse for image captioning and classification.
  # Default: Qwen/Qwen3.5-2B (natively multimodal, ~4GB VRAM).
  # Production: Qwen/Qwen3.5-35B-A3B-FP8 (~48GB GPU VRAM).
  # Not needed for text-only OCR — only for image understanding.
  vlm:
    profiles: ["ocr-vlm"]
    image: vllm/vllm-openai:nightly
    ports:
      - "8008:8008"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${VLM_GPU:-2}
      NO_PROXY: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse
      no_proxy: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse
    volumes:
      - vlm-model-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${VLM_MODEL:-Qwen/Qwen3.5-2B}"
      - "--port"
      - "8008"
      - "--served-model-name"
      - "${VLM_MODEL:-Qwen/Qwen3.5-2B}"
      - "--gpu-memory-utilization"
      - "0.50"
      - "--trust-remote-code"
      - "--max-model-len"
      - "8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLM_GPU:-2}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  # --- GLM-OCR Service (starts with --profile ocr) ---
  # GLM-OCR 0.9B served via vLLM nightly with MTP speculative decoding.
  # Requires vLLM nightly (glm_ocr architecture + transformers >= 5.0).
  # ~8GB GPU VRAM.
  glm-ocr:
    profiles: ["ocr"]
    image: vllm/vllm-openai:glm51
    ports:
      - "8082:8080"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${GLM_OCR_GPU:-1}
      NO_PROXY: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse
      no_proxy: localhost,127.0.0.1,glm-ocr,vlm,minio,nats,veda,flashparse
    volumes:
      - glm-ocr-model-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "zai-org/GLM-OCR"
      - "--port"
      - "8080"
      - "--served-model-name"
      - "glm-ocr"
      - "--gpu-memory-utilization"
      - "0.50"
      - "--trust-remote-code"
      - "--speculative-config.method"
      - "mtp"
      - "--speculative-config.num_speculative_tokens"
      - "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GLM_OCR_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  # --- Monitoring Stack (optional, enabled with --profile monitoring) ---
  otel-collector:
    profiles: ["monitoring"]
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ./config/monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    ports:
      - "9190:9090"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - mimir

  mimir:
    profiles: ["monitoring"]
    image: grafana/mimir:latest
    ports:
      - "9109:9009"
    volumes:
      - ./config/monitoring/mimir.yml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    environment:
      MINIO_USER: ${MINIO_USER:-veda}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-vedapassword}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    depends_on:
      minio:
        condition: service_healthy

  tempo:
    profiles: ["monitoring"]
    image: grafana/tempo:2.7.0
    ports:
      - "3200:3200"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ./config/monitoring/tempo.yml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ./config/monitoring/loki.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vedagrafana}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  minio-data:
  nats-data:
  veda-data:
  veda-1-data:
  veda-2-data:
  veda-3-data:
  flashparse-data:
  embedding-model-cache:
  vlm-model-cache:
  glm-ocr-model-cache:
  multimodal-embedding-model-cache:
  prometheus-data:
  mimir-data:
  tempo-data:
  loki-data:
  grafana-data:
