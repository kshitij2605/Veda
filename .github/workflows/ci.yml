name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 03:00 UTC — picks up upstream lindera / cuvs / etc.
    # breakage in the optional-feature matrices.
    - cron: '0 3 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Strip debuginfo from CI debug builds — it's the dominant consumer of
  # target/ disk on the hosted runners (the linker ran out of space / hit a
  # bus error building the all-targets test binaries). Tests don't need it.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Default build — what most users compile.
  check:
    name: cargo check (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # Per-feature check so the optional cargo features actually compile.
  # gpu_nim is cheap (one HTTP-client dep, no network at build time).
  # lindera is intentionally NOT in this matrix because its `ipadic`
  # feature pulls a build-time HTTPS download from lindera.s3 that
  # CI runners may not be able to reach; see the dedicated
  # `lindera-feature` job below which gates on a manual workflow
  # dispatch.
  check-features:
    name: cargo check (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - veda-index/gpu_nim
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features ${{ matrix.feature }}

  # Lindera feature compile — runs on workflow_dispatch and weekly cron
  # only, so a sandbox without outbound network doesn't fail the
  # default CI pipeline. When this runs it both verifies the lindera
  # 0.32 API surface still matches our wrapper and exercises the dict
  # download path.
  lindera-feature:
    name: cargo check (lindera_tokenizer)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features veda-storage/lindera_tokenizer

  # All unit + integration tests.
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # Fail the build on clippy warnings — the only enforced lint pass.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Rustfmt check — keeps the diff noise down.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
