name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 03:00 UTC — picks up upstream cuvs / etc.
    # breakage in the optional-feature matrices.
    - cron: '0 3 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Strip debuginfo from CI debug builds — it's the dominant consumer of
  # target/ disk on the hosted runners (the linker ran out of space / hit a
  # bus error building the all-targets test binaries). Tests don't need it.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Default build — what most users compile.
  check:
    name: cargo check (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # Per-feature check so the optional cargo features actually compile.
  # gpu_nim is cheap (one HTTP-client dep, no network at build time).
  check-features:
    name: cargo check (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - veda-index/gpu_nim
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features ${{ matrix.feature }}

  # In-binary CAGRA GPU index compile.
  #
  # This job exists because its absence let `gpu_cuvs` rot: the feature
  # went unbuilt by anyone for months and accumulated six compile errors,
  # including calls to cuvs APIs that do not exist. `check-features` above
  # cannot cover it — gpu_cuvs needs a CUDA toolchain, a prebuilt libcuvs,
  # and nine `<Package>_DIR` variables (cmake-rs blanks CMAKE_PREFIX_PATH,
  # rust-lang/cmake-rs#111).
  #
  # No GPU is required: this compiles and LINKS, which is exactly what
  # broke. It deliberately runs `cargo build --tests` rather than
  # `cargo check` — `check` does not link, and the missing-libcuvs_c link
  # error is invisible to it. The GPU tests themselves are `#[ignore]`d
  # and run on hardware; see the module docs in gpu_cuvs.rs.
  #
  # WHY THIS IS NOT A BLOCKING JOB, and what would make it one:
  # It compiles and links but cannot *run* anything — ubuntu-latest has
  # no GPU. So it stays on schedule + manual dispatch rather than every
  # push, the authoritative verification stays on the GPU host, and the
  # weekly run is what stops gpu_cuvs silently rotting again the way it
  # did before. It becomes blocking the moment a CUDA runner exists.
  #
  # THE CUDA COMPILER comes from NVIDIA's apt repo below, not pip: `nvcc`
  # has no usable wheel, and the `nvidia-*-cu12` wheels install a split
  # layout (nvidia/cuda_runtime/, nvidia/cublas/, ...) that CMake's
  # FindCUDAToolkit does not recognise. Only the compiler and the cudart
  # headers are installed, NOT the ~3 GB `cuda-toolkit` metapackage:
  # cuvs arrives prebuilt as a wheel, so nvcc is here to satisfy
  # cuvs-sys's `project(... CUDA)` language declaration and compile its
  # own thin kernels — not to build RAPIDS from source.
  gpu-cuvs-feature:
    name: cargo build (veda-index/gpu_cuvs)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install a CUDA compiler (nvcc + cudart headers only)
        run: |
          set -euo pipefail
          . /etc/os-release
          REPO="ubuntu$(echo "$VERSION_ID" | tr -d .)"
          curl -fsSLO "https://developer.download.nvidia.com/compute/cuda/repos/$REPO/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-6 cuda-cudart-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDACXX=/usr/local/cuda-12.6/bin/nvcc" >> "$GITHUB_ENV"
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          /usr/local/cuda-12.6/bin/nvcc --version
          ls -l /usr/local/cuda-12.6/lib64/libcudart.so
          df -h /
      - name: Cache the cuVS toolchain wheels
        uses: actions/cache@v4
        with:
          path: ~/cuvs-venv
          key: cuvs-venv-${{ runner.os }}-libcuvs26.4.0-cmake3.31-v1
      - name: Install the cuVS build toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/cuvs-venv/bin/cmake" ]; then
            python3 -m venv "$HOME/cuvs-venv"
            # cuvs-sys 26.4 needs CMake >= 3.30.4; ubuntu ships 3.22.
            # Pinned to 3.31 rather than 4.x: RAPIDS' cmake modules are
            # not validated against CMake 4's stricter compatibility rules.
            "$HOME/cuvs-venv/bin/pip" install --quiet 'cmake==3.31.*' libclang
            # A prebuilt libcuvs, so cuvs-sys links it instead of building
            # RAPIDS from source (which takes hours).
            "$HOME/cuvs-venv/bin/pip" install --quiet \
              --extra-index-url https://pypi.nvidia.com 'libcuvs-cu12==26.4.0'
          fi
          df -h /
      - uses: Swatinem/rust-cache@v2
      - name: Build veda-index with gpu_cuvs
        run: |
          set -euo pipefail
          V="$(echo "$HOME"/cuvs-venv/lib/python3*/site-packages)"
          export PATH="$HOME/cuvs-venv/bin:$PATH"
          export LIBCLANG_PATH="$V/clang/native"
          # The pip libclang wheel ships no builtin headers, so point clang
          # at gcc's; without this it cannot find limits.h. cuvs's c_api.h
          # then includes <cuda_runtime.h>, which lives in the apt CUDA
          # tree rather than the wheel — bindgen needs both roots.
          GCC_INC="$(echo /usr/lib/gcc/x86_64-linux-gnu/*/include | tr ' ' '\n' | tail -1)"
          export BINDGEN_EXTRA_CLANG_ARGS="-I$GCC_INC -I$CUDA_PATH/include"
          # cmake-rs blanks CMAKE_PREFIX_PATH, so each package is located
          # by its own _DIR variable instead.
          export cuvs_DIR="$V/libcuvs/lib64/cmake/cuvs"
          export raft_DIR="$V/libraft/lib64/cmake/raft"
          export rmm_DIR="$V/librmm/lib64/cmake/rmm"
          export rapids_logger_DIR="$V/rapids_logger/lib64/cmake/rapids_logger"
          export nvtx3_DIR="$V/librmm/lib64/cmake/nvtx3"
          export CCCL_DIR="$V/libraft/lib64/rapids/cmake/cccl"
          export Thrust_DIR="$V/libraft/lib64/rapids/cmake/thrust"
          export CUB_DIR="$V/libraft/lib64/rapids/cmake/cub"
          export libcudacxx_DIR="$V/libraft/lib64/rapids/cmake/libcudacxx"
          # Keep the workflow-level -Dwarnings: setting RUSTFLAGS here
          # replaces it wholesale, and clippy does not build this feature,
          # so dropping it would leave gpu_cuvs with no lint coverage.
          export RUSTFLAGS="-Dwarnings -L native=$V/libcuvs/lib64 -L native=$CUDA_PATH/lib64"
          export LD_LIBRARY_PATH="$V/libcuvs/lib64:$V/libraft/lib64:$V/librmm/lib64:$V/rapids_logger/lib64:$CUDA_PATH/lib64:${LD_LIBRARY_PATH:-}"
          cargo build -p veda-index --features gpu_cuvs --tests

  # All unit + integration tests.
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # Fail the build on clippy warnings — the only enforced lint pass.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install protoc (prost-build needs it for veda-log)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Rustfmt check — keeps the diff noise down.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check

  # Niriksha typecheck + tests. There was no frontend job at all: the dashboard
  # ships 21 test files / 45 tests and a lint config, and CI ran none of them,
  # so a broken build or a failing test reached main unnoticed. Same shape as
  # the gpu_cuvs gap — a check that exists but never runs.
  #
  # `tsc -b` and `vitest` only. `eslint` is deliberately NOT wired, and the
  # reason is a measurement rather than a guess: `react-hooks/set-state-in-effect`
  # rejects the classic "set loading, fetch, set data" effect, and 13 of the 38
  # files using `useEffect` do exactly that. Satisfying it is a data-fetching
  # refactor of the whole dashboard, not a lint cleanup. A gate that fails on
  # arrival gets switched off within a day.
  #
  # eslint over `src` also takes >5 minutes here, so it would be the slowest
  # job in this workflow by some margin.
  #
  # Revisit if the dashboard moves to a query library or React 19 `use()`,
  # which is what would remove the pattern wholesale.
  niriksha:
    name: niriksha (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: niriksha/package-lock.json
      - name: Install
        working-directory: niriksha
        run: npm ci
      - name: Typecheck
        working-directory: niriksha
        run: npx tsc -b --noEmit
      - name: Tests
        working-directory: niriksha
        run: npm test

  # Python SDK install + tests across the declared Python range. There was
  # no Python job before, so two SDK ship-blockers reached main: an invalid
  # `hatchling.backends` build-backend, and PEP 604 `X | None` annotations
  # that raise at runtime on 3.9 (the declared floor AND the RHEL 9 system
  # Python). 3.9 is the regression guard; 3.12 covers the recent end.
  python-sdk:
    name: python sdk (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK + dev extras
        run: pip install -e "sdk/python[dev]"
      - name: Run SDK tests
        run: cd sdk/python && python -m pytest -q
