[workspace]
resolver = "2"
members = [
    "crates/veda-core",
    "crates/veda-storage",
    "crates/veda-index",
    "crates/veda-query",
    "crates/veda-coordinator",
    "crates/veda-gateway",
    "crates/veda-server",
    "crates/veda-time",
    "crates/veda-log",
]
# `crates/veda-coordinator-raftrs` exists as a *decision artifact*
# (see documentation/consensus-swap-decision.md). It's deliberately
# excluded from the workspace so it doesn't pull raft-rs into every
# `cargo build`. To examine the swap surface:
#   cd crates/veda-coordinator-raftrs && cargo build
exclude = ["crates/veda-coordinator-raftrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "metrics", "logs", "trace"] }
tracing-opentelemetry = "0.28"
opentelemetry-appender-tracing = "0.27"

# Internal crates
veda-core = { path = "crates/veda-core" }
veda-storage = { path = "crates/veda-storage" }
veda-index = { path = "crates/veda-index" }
veda-query = { path = "crates/veda-query" }
veda-coordinator = { path = "crates/veda-coordinator" }
veda-gateway = { path = "crates/veda-gateway" }
veda-time = { path = "crates/veda-time" }
veda-log = { path = "crates/veda-log" }
