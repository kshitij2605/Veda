[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veda-client"
version = "0.1.0"
description = "Python client for Veda multimodal vector database"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
dev = ["pytest>=7.0", "requests-mock>=1.11"]
