{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veda.fullname" . }}-auth
  labels:
    {{- include "veda.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt_secret: {{ required "auth.jwtSecret must be set when auth.enabled" .Values.auth.jwtSecret | quote }}
  admin_password: {{ .Values.auth.adminPassword | quote }}
{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veda.fullname" . }}-minio
  labels:
    {{- include "veda.labels" . | nindent 4 }}
type: Opaque
stringData:
  root_user: {{ .Values.minio.rootUser | quote }}
  root_password: {{ .Values.minio.rootPassword | quote }}
{{- end }}
