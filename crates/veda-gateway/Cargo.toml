[package]
name = "veda-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
veda-core = { workspace = true }
veda-query = { workspace = true }
veda-storage = { workspace = true }
veda-index = { workspace = true }
veda-coordinator = { workspace = true }
veda-time = { workspace = true }
veda-log = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", features = ["json", "multipart"] }
jsonwebtoken = "9"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
zip = "2"
async-nats = "0.38"
futures = "0.3"
base64 = "0.22"
argon2 = "0.5"
constant_time_eq = "0.3"

[dev-dependencies]
jsonwebtoken = "9"
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
