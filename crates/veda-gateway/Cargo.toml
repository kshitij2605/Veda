[package]
name = "veda-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
veda-core = { workspace = true }
veda-query = { workspace = true }
veda-storage = { workspace = true }
veda-index = { workspace = true }
veda-coordinator = { workspace = true }
veda-time = { workspace = true }
veda-log = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", features = ["json", "multipart"] }
jsonwebtoken = "9"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
url = "2"
zip = "2"
async-nats = "0.38"
futures = "0.3"
base64 = "0.22"
argon2 = "0.5"
constant_time_eq = "0.3"
cron = "0.16"
chrono = "0.4"
regex = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# On-demand CPU profiling — optional, only pulled in under the
# `profiling` feature (signal-based sampling profiler is not free).
pprof = { version = "0.15", default-features = false, features = ["flamegraph", "protobuf-codec"], optional = true }
protobuf = { version = "3", optional = true }

[features]
# Enables the `GET /v1/admin/pprof` on-demand CPU-profiling endpoint.
# Off by default so `pprof`/`protobuf` are not compiled into normal builds.
profiling = ["dep:pprof", "dep:protobuf"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonwebtoken = "9"
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
