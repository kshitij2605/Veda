[package]
name = "veda-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
# Cross-platform SIMD distance kernels (AVX-512, NEON, SVE). Veda's own
# AVX2+FMA + scalar implementations remain the default; enabling this
# feature provides a richer set of architectures.
simsimd = { version = "6", optional = true }

[features]
default = []
# Use SimSIMD for distance computation when available. Adds a build-time
# dependency on the SimSIMD C library.
simsimd = ["dep:simsimd"]

[[bench]]
name = "distance_bench"
harness = false
