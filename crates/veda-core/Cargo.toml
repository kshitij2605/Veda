[package]
name = "veda-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
# No "blocking" feature: the async runtime is the only context this crate
# runs in, and a blocking client dropped inside a Tokio worker panics.
# That bug shipped once (splade_client, PR #22) and sat latent in
# chunking::contextualize_chunks until it was made async. Dropping the
# feature makes the mistake unavailable rather than merely absent.
reqwest = { version = "0.12", features = ["json", "stream"] }
# Stream combinators for the streaming chat-completion path (complete_stream).
futures = "0.3"
base64 = "0.22"
# Cross-platform SIMD distance kernels (AVX-512, NEON, SVE). Veda's own
# AVX2+FMA + scalar implementations remain the default; enabling this
# feature provides a richer set of architectures.
simsimd = { version = "6", optional = true }
# BLIS-style microkernel for SGEMM. Used by the GEMM-backed
# MaxSim path to materialise the Q×D similarity matrix in one
# pass. Apache-2.0 / MIT.
matrixmultiply = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
opentelemetry_sdk = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["simsimd"]
# Use SimSIMD for distance computation when available. Adds a build-time
# dependency on the SimSIMD C library.
simsimd = ["dep:simsimd"]

[[bench]]
name = "distance_bench"
harness = false
