[package]
name = "veda-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
veda-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
openraft = { version = "0.9", features = ["serde"] }
bincode = "1.3"
async-trait = "0.1"
# Tonic gRPC for cross-process Raft transport. Proto compilation
# happens in build.rs.
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
# Vendored protoc — no system-level protobuf-compiler install needed.
protobuf-src = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
