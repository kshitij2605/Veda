[package]
name = "veda-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
veda-core = { workspace = true }
veda-storage = { workspace = true }
veda-time = { workspace = true }
bytes = { version = "1", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
openraft = { version = "0.9", features = ["serde"] }
bincode = "1.3"
async-trait = "0.1"
# Per-entry WAL record framing (raft_wal.rs).
crc32fast = "1"
# Tonic gRPC for cross-process Raft transport. Proto compilation
# happens in build.rs.
tonic = "0.12"
prost = "0.13"
# Cross-node health probes (peer_health.rs) — HTTP GET on each
# peer's /admin/health. rustls-tls so we don't drag in OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

# Linearisability harness — drives the cluster and runs the
# checker module against the recorded history.
[[bin]]
name = "veda-linearisability-harness"
path = "src/bin/linearisability_harness.rs"

[[bench]]
name = "raft_throughput"
path = "benches/raft_throughput.rs"
harness = false
