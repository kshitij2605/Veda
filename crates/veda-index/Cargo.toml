[package]
name = "veda-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
veda-core = { workspace = true }
veda-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
roaring = "0.10"
bincode = "1.3"
# Optional: blocking HTTP client for the NVIDIA NIM GPU build offload.
# Only pulled in when the gpu_nim feature is on.
reqwest = { version = "0.12", optional = true, features = ["blocking"] }
# Optional: NVIDIA cuVS Rust bindings + ndarray for the in-binary GPU
# build path. Both require the CUDA toolkit at build time and an
# NVIDIA GPU at runtime. Default builds do not pull these in.
cuvs = { version = "26.4", optional = true }
cuvs-sys = { version = "26.4", optional = true }
ndarray = { version = "0.15", optional = true }

[features]
default = []
# GPU-accelerated index building via NVIDIA cuVS. Requires CUDA toolkit
# at build time and an NVIDIA GPU at runtime. Currently a placeholder —
# see documentation/gpu-indexing.md for the integration plan.
gpu = []
# Offload HNSW (CAGRA → HNSW) build to an NVIDIA NIM container over
# HTTP. Lets the Veda binary stay CUDA-free while getting GPU build
# performance. Off by default; activate with
# --features veda-index/gpu_nim.
gpu_nim = ["dep:reqwest"]
# In-binary cuVS path: link cuvs-rs into Veda so the binary itself
# runs CAGRA on the GPU (alternative to gpu_nim). Activating this
# feature requires the CUDA toolkit on the build host; default
# builds stay CUDA-free.
gpu_cuvs = ["dep:cuvs", "dep:cuvs-sys", "dep:ndarray"]

[dev-dependencies]
tempfile = "3"
roaring = "0.10"
