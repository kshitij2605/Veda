[package]
name = "veda-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
veda-core = { workspace = true }
veda-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
roaring = "0.10"
bincode = "1.3"

[features]
default = []
# GPU-accelerated index building via NVIDIA cuVS. Requires CUDA toolkit
# at build time and an NVIDIA GPU at runtime. Currently a placeholder —
# see documentation/gpu-indexing.md for the integration plan.
gpu = []

[dev-dependencies]
tempfile = "3"
roaring = "0.10"
