[package]
name = "veda-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
veda-core = { workspace = true }
veda-log = { workspace = true }
veda-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
memmap2 = "0.9"
roaring = "0.10"
bytes = { version = "1", features = ["serde"] }
base64 = "0.22"
bincode = "1.3"
crc32fast = "1"
rust-s3 = { version = "0.35", features = ["sync-rustls-tls"], default-features = false }
async-nats = "0.38"
tokio = { workspace = true }
futures = "0.3"
# Optional: lindera (Kuromoji-compatible) tokenizer for BM25 on
# Japanese corpora. Opt-in. The `ipadic` feature pulls the lindera
# tokenizer / dictionary modules into scope; that path also triggers
# a build-time fetch of the IPADIC dict tarball from
# lindera.s3.ap-northeast-1.amazonaws.com — builds in offline
# environments need to vendor it (LINDERA_IPADIC_TARBALL env var
# accepted by the lindera build script). At runtime the operator
# can override the bundled dict with VEDA_LINDERA_DICT_PATH; without
# that, the tokenizer falls back to cjk_bigram with a one-shot warn.
lindera = { version = "0.32", optional = true, default-features = false, features = ["ipadic"] }
rust-stemmers = "1"
zstd = "0.13"
parquet = { workspace = true }
arrow = { workspace = true }

[features]
default = []
lindera_tokenizer = ["dep:lindera"]

[dev-dependencies]
tempfile = "3"
