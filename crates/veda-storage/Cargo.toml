[package]
name = "veda-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
veda-core = { workspace = true }
veda-log = { workspace = true }
veda-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
memmap2 = "0.9"
roaring = "0.10"
bytes = { version = "1", features = ["serde"] }
base64 = "0.22"
bincode = "1.3"
crc32fast = "1"
rust-s3 = { version = "0.35", features = ["sync-rustls-tls"], default-features = false }
async-nats = "0.38"
tokio = { workspace = true }
futures = "0.3"
rust-stemmers = "1"
zstd = "0.13"
parquet = { workspace = true }
arrow = { workspace = true }

[features]
default = []

[dev-dependencies]
tempfile = "3"
