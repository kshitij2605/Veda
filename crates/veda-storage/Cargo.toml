[package]
name = "veda-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = { workspace = true }
veda-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
memmap2 = "0.9"
roaring = "0.10"
base64 = "0.22"
bincode = "1.3"
rust-s3 = { version = "0.35", features = ["sync-rustls-tls"], default-features = false }
async-nats = "0.38"
tokio = { workspace = true }
futures = "0.3"
# Optional: lindera (Kuromoji-compatible) tokenizer for BM25 on
# Japanese corpora. Heavy build (~50MB dict, several minutes of
# compile time) so it's opt-in. Builds without this feature still
# recognise the `lindera` schema flag at the type level but fall back
# to cjk_bigram at runtime with a one-shot warning.
lindera = { version = "0.32", optional = true, default-features = false, features = ["ipadic"] }

[features]
default = []
lindera_tokenizer = ["dep:lindera"]

[dev-dependencies]
tempfile = "3"
