<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fb" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Niriksha · Veda</title>

    <script>
      /* Theme init before paint — light is the default; respect a stored choice.
         Single source of truth is data-theme on <html>. */
      try {
        var t = localStorage.getItem('veda_theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      /* Pre-hydration paint — match the active theme's canvas before React mounts */
      html { margin: 0; }
      body { margin: 0; }
      html[data-theme='light'], html[data-theme='light'] body { background: oklch(0.985 0.004 255); }
      html[data-theme='dark'], html[data-theme='dark'] body { background: oklch(0.105 0.004 252); }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
