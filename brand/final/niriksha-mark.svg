<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- FINAL Niriksha mark — eye of nodes: the watching eye drawn the same way
       Veda's V is drawn, a closed walk through six nodes with the pupil at
       center. Violet #9D8CFF (on light use #6A57E8). -->
  <g stroke="#9D8CFF" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M8 34 L20 24 L44 24 L56 34 L44 44 L20 44 Z"/>
  </g>
  <circle cx="8" cy="34" r="2.7" fill="#9D8CFF"/>
  <circle cx="20" cy="24" r="2.7" fill="#9D8CFF"/>
  <circle cx="44" cy="24" r="2.7" fill="#9D8CFF"/>
  <circle cx="56" cy="34" r="2.7" fill="#9D8CFF"/>
  <circle cx="44" cy="44" r="2.7" fill="#9D8CFF"/>
  <circle cx="20" cy="44" r="2.7" fill="#9D8CFF"/>
  <circle cx="32" cy="34" r="5.5" fill="#9D8CFF"/>
</svg>
