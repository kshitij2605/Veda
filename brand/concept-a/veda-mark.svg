<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Veda — "kNN Constellation": a V traced through a nearest-neighbor graph.
       Dark-background colorway. On light, use #E8960B for saffron, #5A6170 for the satellite. -->
  <g stroke="#FFB224" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M13 12 L22.5 30 L32 48 L41.5 30 L51 12"/>
    <path d="M41.5 30 L56 30" stroke-opacity=".25" stroke-width="1.5"/>
  </g>
  <circle cx="13" cy="12" r="3.5" fill="#FFB224"/>
  <circle cx="22.5" cy="30" r="3" fill="#FFB224"/>
  <circle cx="32" cy="48" r="5" fill="#FFB224"/>
  <circle cx="41.5" cy="30" r="3" fill="#FFB224"/>
  <circle cx="51" cy="12" r="3.5" fill="#FFB224"/>
  <circle cx="56" cy="30" r="2.2" fill="#F2F4F8" fill-opacity=".7"/>
</svg>
