openapi: 3.0.3
info:
  title: Veda REST API
  version: 0.1.0
  description: |
    REST API exposed by `veda-gateway`. The shape mirrors what
    `crates/veda-gateway/src/rest/` actually serves; this file is
    hand-maintained rather than generated, so when adding a route
    update the relevant section here. Routes prefixed `/v1/admin`
    require the bearer token when `auth_enabled=true`.

    Conventions:
      - All bodies are JSON unless noted.
      - Standard error envelope: `{ "error": "<message>" }`.
      - When the gateway is in Raft mode and the caller hits a
        follower for a mutating request, the response is a
        `307 Temporary Redirect` with `Location:` pointing at
        the current leader.

servers:
  - url: http://localhost:6340
    description: default single-node dev port
  - url: http://localhost:6342
    description: node-2 in the 3-node raft-cluster compose profile
  - url: http://localhost:6344
    description: node-3 in the 3-node raft-cluster compose profile

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Connector:
      type: object
      description: |
        A data-source connector. The web tools (`web_search` / `fetch_url`)
        live in the agent tool catalog and are not REST paths.
      required: [kind, name]
      properties:
        id: { type: string, description: "optional on create → server assigns conn-{uuid}" }
        kind: { type: string, enum: [web, websearch] }
        name: { type: string }
        config: { type: object, description: "kind-specific config (e.g. urls, collection, deep_crawl, max_pages for web)" }
        enabled: { type: boolean }
    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
    NodeInfo:
      type: object
      properties:
        id: { type: string }
        address: { type: string }
        role: { type: string, enum: [leader, follower, candidate, unknown] }
        status: { type: string }
        version: { type: string }
        uptime_secs: { type: integer }
        shard_count: { type: integer }
        collection_count: { type: integer }
        is_self: { type: boolean }
    ListNodesResponse:
      type: object
      properties:
        mode: { type: string, enum: [single, raft] }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeInfo' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
    FieldDef:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [vector, string, int64, float64, bool, blob, sparse]
        dimension: { type: integer, description: "Required for vector type" }
        metric:
          type: string
          enum: [cosine, dot_product, euclidean, manhattan]
        filterable: { type: boolean }
    CreateCollectionRequest:
      type: object
      required: [name, fields]
      properties:
        name: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDef' }
          description: |
            Must be `[]` when `external` is set — an external collection
            infers its schema from the Parquet file(s) at registration;
            declaring a field alongside `external` is rejected with `400`.
        shard_count: { type: integer, default: 1 }
        replication_factor: { type: integer, default: 1 }
        rls_owner_field:
          type: string
          nullable: true
          description: |
            Row-level security. When set, names the record field that
            holds the owner. The gateway then AND-injects
            `<rls_owner_field> == <jwt-subject>` into every read filter
            and enforces owner-on-write at the AST level. Admin bypasses.
        external:
          $ref: '#/components/schemas/ExternalSource'
          nullable: true
          description: |
            Registers a **read-in-place Parquet collection**: Veda reads
            the customer's existing Parquet file(s) directly, in place —
            nothing is ingested or copied, and no index is built. See
            `documentation/2026-08-14-external-parquet-collections-design.md`
            for the full design and the measured costs below.

            **Known limitations of an external collection, all enforced,
            none silent:**
              - **Exact search is linear** in row count — no index exists,
                so latency scales with row count and recall is 1.0 by
                construction.
              - **The vector column is memory-resident.** Floor is
                `row_count * dim * 4` bytes — measured at ~2.86 GiB (~3.07
                GB decimal) for 1M rows at 768 dimensions. ids and scalar
                columns add further, unmeasured heap overhead on top. A
                dataset whose vector column alone exceeds available memory
                fails on load rather than degrading.
              - **Object reads are whole-object.** `BlobStore::get` reads
                the entire file, so Parquet's range-request advantage over
                S3/MinIO is lost; column pruning still saves decode CPU,
                not I/O.
              - **A same-size local-file rewrite completing within one
                filesystem clock tick can go undetected** and serve stale
                data; genuine content changes and any size change are
                detected reliably. Object storage backends that return an
                ETag (MinIO, S3) do not share this limitation.
              - **`uri` is a key prefix within the server's configured
                object store, never a bucket.** A URI naming a bucket
                (e.g. `s3://bucket/prefix`) is rejected at registration —
                configure the bucket in server configuration instead.
              - **The collection is read-only.** 18 mutating endpoints
                (insert, embed-insert, delete, reindex,
                rescan-guardrails, seal, optimize, process-document,
                process-documents batch, ingest-url, ingest-media,
                ingest-logs, mvcc-checkpoint, tuning-campaign start and
                apply-trial, connector run, eval-set generation, and
                auto-optimization) return `405`. Dropping the collection
                and alias management still work.
              - **Five read endpoints require locally stored records.**
                `GET /records`, `/aggregate`, `/histogram`,
                `/field-stats` and `/evaluate` return `400` (not `405` —
                these are reads) on an external collection, naming that
                the operation needs locally stored records.
              - **Registering an external collection requires Admin.**
                `POST /v1/collections` with `external` set returns `403`
                for a non-Admin caller — registration can read any
                Parquet the server process can reach. A `..` path
                component anywhere in the URI's key is rejected with
                `400` regardless of caller role.
              - **Auto-tuning campaigns are rejected with a clean `405`**
                before they start. **The agent/MCP retrieval tool has no
                explicit guard**, but fails closed anyway: an external
                collection always registers with `fields: []`, so the
                tool finds no vector fields and returns a `400`-class
                tool error ("collection '...' has no vector fields")
                before ever reaching the query executor — which, unlike
                an earlier version of this document claimed, IS
                registered for external collections same as any other.
              - **`bm25`, `match_phrase`, `sparse`, `hybrid` and `rerank`
                queries all return `400`** — see the `/search` path below.
              - `truncate_to` and `explain: true` on a search request are
                silently **ignored**, not rejected: the response's
                `explain` is always `null`, and MRL truncation never
                applies. The query's `field` is not validated against the
                collection's `vector_field`.
              - **Observability is partial.** Search duration, the
                query log, and most tracing span attributes are recorded;
                the `explain` per-phase timing breakdown is not, because
                it is never computed.
              - A hit's row id appears **twice**: once as `SearchHit.id`,
                once again as a column inside `SearchHit.fields`. External
                hits carry no `_guardrail_class` annotation.
    ExternalSource:
      type: object
      required: [format, uri, id_field, vector_field, metric]
      properties:
        format:
          type: string
          description: "Only `\"parquet\"` is supported today."
        uri:
          type: string
          description: |
            A key or key prefix **within the server's configured object
            store**, or `file:///abs/path` for a local file. Anything not
            ending in `.parquet` is a prefix and selects every
            `*.parquet` object beneath it (anchored on `/`, so
            `embeddings/` never matches a sibling like
            `embeddings-v1/...`). A URI naming a bucket is rejected — see
            the `external` description above.
        id_field:
          type: string
          description: "Column holding the record id. Utf8, LargeUtf8, Int32 or Int64; stringified into Veda's record id. Nulls are rejected."
        vector_field:
          type: string
          description: "Column holding the dense vector. Must be FixedSizeList<Float32>."
        metric:
          type: string
          enum: [Cosine, DotProduct, Euclidean]
          description: |
            Not inferable from Parquet, so required. Note the casing:
            `ExternalSource.metric` deserializes the `DistanceMetric` enum
            directly (`"Cosine"`, `"DotProduct"`, `"Euclidean"`) — unlike
            an ordinary vector field's `metric` in `FieldDef` (see above),
            which accepts lowercase (`"cosine"`, `"dot_product"`,
            `"euclidean"`). The two are parsed by different code paths;
            using the `FieldDef` casing here is rejected.
    InsertRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { type: object, additionalProperties: true }
    InsertResponse:
      type: object
      properties:
        inserted: { type: integer }
        ids:
          type: array
          items: { type: string }
          description: "Per-record UUIDs assigned by the gateway. Always populated."
    SearchHit:
      type: object
      properties:
        id: { type: string }
        distance: { type: number }
        fields:
          type: object
          additionalProperties: true
          description: |
            On an external (read-in-place Parquet) collection, the id
            column appears here a second time under its own column name,
            in addition to the top-level `id` above — nothing strips it
            back out. An external hit also never carries a
            `_guardrail_class` annotation, unlike an internal hit.
    SearchRequest:
      type: object
      required: [query, limit]
      properties:
        query:
          type: object
          description: |
            One of `vector`, `bm25`, `sparse_vector`, `hybrid`,
            `colpali`, `multi_vector` — see the Rust types in
            `crates/veda-gateway/src/rest/search.rs`. An external
            collection supports `vector` only; `bm25`, `match_phrase`,
            `sparse_vector` and `hybrid` all return `400` naming the
            missing index (Parquet carries no inverted or sparse index).
            A `vector` query's `field` is not validated against the
            collection's registered `vector_field` on an external
            collection — an internal collection does validate this.
        filter:
          type: string
          description: |
            SQL-like filter DSL. Supports dotted paths into nested JSON
            fields, e.g. `meta.user.tier = "gold"`.
        limit: { type: integer }
        explain:
          type: boolean
          description: |
            On an external collection this is silently **ignored**: the
            response's `explain` is always `null` and no per-phase timing
            is computed. An internal collection honours it.
        truncate_to:
          type: integer
          nullable: true
          description: |
            MRL (Matryoshka) query-vector truncation. On an external
            collection this is silently **ignored** — the full vector is
            always scored. An internal collection honours it.
        rerank:
          type: object
          nullable: true
          properties:
            field: { type: string }
            query: { type: string }
            top_k: { type: integer }
            model: { type: string, nullable: true }
          description: |
            Unavailable on an external collection — returns `400`.
            Rerank resolves each candidate's text via internal
            record-storage lookups that an external collection does not
            hold locally.
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        count: { type: integer }
        took_ms: { type: integer }
        explain: { type: object, nullable: true }
        hybrid_explain: { type: object, nullable: true }
    ChunkPreviewRequest:
      type: object
      required: [text, runs]
      properties:
        text: { type: string }
        runs:
          type: array
          items:
            type: object
            required: [strategy_name]
            properties:
              label: { type: string }
              strategy_name: { type: string }
              chunk_size: { type: integer }
              chunk_overlap: { type: integer }
    ChunkPreviewResponse:
      type: object
      properties:
        input_chars: { type: integer }
        runs:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              strategy_name: { type: string }
              elapsed_ms: { type: number }
              total_chunks: { type: integer }
              total_chars: { type: integer }
              avg_chars: { type: number }
              min_chars: { type: integer }
              max_chars: { type: integer }
              truncated: { type: boolean }
              chunks:
                type: array
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    text: { type: string }
                    char_count: { type: integer }
                    start_offset: { type: integer }
                    end_offset: { type: integer }
                    heading_path:
                      type: array
                      items: { type: string }
                    page_number: { type: integer, nullable: true }
    CoverageResponse:
      type: object
      properties:
        window_secs: { type: integer }
        total_queries: { type: integer }
        total_chunks: { type: integer }
        retrieved_chunks: { type: integer }
        orphan_count: { type: integer }
        top_hits:
          type: array
          items:
            type: object
            properties:
              doc_id: { type: string }
              count: { type: integer }
              fraction: { type: number }
        orphan_sample:
          type: array
          items: { type: string }
    CreateJobRequest:
      type: object
      required: [name, cron, kind]
      properties:
        name: { type: string, description: "Unique job name; re-registering overwrites." }
        cron: { type: string, description: "Cron expression (validated by the `cron` crate)." }
        kind:
          type: object
          description: |
            Tagged `JobKind`. Exactly one of `TtlSweep`, `Reindex`,
            `Compact`, `Evaluate`, each carrying `{ collection }`.
            e.g. `{ "TtlSweep": { "collection": "docs" } }`. Only
            `TtlSweep` is wired to an action today.
    JobResponse:
      type: object
      properties:
        name: { type: string }
        cron: { type: string }
        kind: { type: object }
        last_run: { type: integer, nullable: true, description: "Unix seconds of the last dispatch." }
    AggregateResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: "Group value (empty string when no group_by)." }
              value: { type: number }
    HistogramResponse:
      type: object
      properties:
        bins:
          type: array
          items:
            type: object
            properties:
              lo: { type: number }
              hi: { type: number }
              count: { type: integer }
    FieldStatsResponse:
      type: object
      properties:
        field: { type: string }
        total_count: { type: integer }
        null_count: { type: integer }
        cardinality: { type: integer }
        min: { type: number, nullable: true, description: "Numeric fields only." }
        max: { type: number, nullable: true, description: "Numeric fields only." }
        avg: { type: number, nullable: true, description: "Numeric fields only." }
        min_length: { type: integer, nullable: true, description: "String fields only." }
        max_length: { type: integer, nullable: true, description: "String fields only." }
    Agent:
      type: object
      required: [name]
      properties:
        id: { type: string, description: "Omit/empty on create to auto-generate." }
        name: { type: string }
        description: { type: string }
        instructions: { type: string, description: "System prompt for the agent." }
        tool_ids:
          type: array
          items: { type: string }
          description: "Tool ids this agent may call; empty = all builtins."
        model:
          type: object
          nullable: true
          description: "Per-agent LLM override; null = global VEDA_LLM config."
          properties:
            endpoint: { type: string, nullable: true }
            model: { type: string, nullable: true }
    AgentTool:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, description: "Interpreted by the tool catalog." }
        config: { type: object, additionalProperties: true }
    ConverseRequest:
      type: object
      required: [input]
      properties:
        input: { type: string }
        conversation_id: { type: string, nullable: true, description: "Continue an existing conversation; omit to start a new one." }
        attachments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              kind: { type: string }
              data_b64: { type: string, nullable: true }
    AgentStep:
      type: object
      description: |
        One trace step, discriminated by `kind`:
        `reasoning` { text }, `tool_call` { tool_call_id, tool_id, args },
        `tool_result` { tool_call_id, result, is_error }.
      properties:
        kind: { type: string, enum: [reasoning, tool_call, tool_result] }
        text: { type: string }
        tool_call_id: { type: string }
        tool_id: { type: string }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        is_error: { type: boolean }
        duration_ms: { type: integer, description: "wall time of the tool call (on tool_result steps)" }
    RunMetrics:
      type: object
      description: Per-run agent timing and token accounting.
      properties:
        total_ms: { type: integer }
        llm_ms: { type: integer }
        tool_ms: { type: integer }
        steps: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        ttft_ms: { type: integer, nullable: true, description: "stream-only time-to-first-token in ms; null for the blocking /converse path" }
    ConverseResponse:
      type: object
      properties:
        conversation_id: { type: string }
        response: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        metrics: { $ref: '#/components/schemas/RunMetrics' }
        citations:
          type: array
          description: Citations extracted from the run's retrieval tool calls (best-effort).
          items: { $ref: '#/components/schemas/Citation' }
        grounding: { $ref: '#/components/schemas/Grounding' }
        cache_hit: { type: boolean, description: "true when a near-duplicate prompt was served from the semantic response cache (opt-in Agent.cache; the LLM was not called and steps is 0)" }
        guardrails: { $ref: '#/components/schemas/GuardrailReport' }
    GuardrailReport:
      type: object
      description: Embedding-based safety screening of the input and output (present only when the agent has guardrails enabled).
      properties:
        input_verdict: { type: string, enum: [allow, flag, block], description: "verdict on the user input" }
        output_verdict: { type: string, enum: [allow, flag, block], description: "verdict on the model output" }
        categories:
          type: array
          description: "triggered categories"
          items: { type: string, enum: [prompt_injection, jailbreak, pii, unsafe] }
        mode: { type: string, enum: [flag, block], description: "Flag annotates; Block short-circuits the LLM with a refusal" }
        method: { type: string, enum: [embedding, regex], description: "embedding (max-cosine to the bad-pattern set + PII regex) or regex-only when no embedder is configured" }
    Citation:
      type: object
      properties:
        chunk_id: { type: string }
        collection: { type: string }
        snippet: { type: string }
        score: { type: number }
    Grounding:
      type: object
      description: Post-run grounding scores (0–1), best-effort and non-fatal.
      properties:
        faithfulness: { type: number, description: "0–1; how grounded the answer is in retrieved context" }
        answer_relevancy: { type: number, description: "0–1; how relevant the answer is to the query" }
        method:
          type: string
          enum: [llm_judge, embedding_overlap, no_context]
          description: "llm_judge (RAGAS-style, primary), embedding_overlap (no-LLM fallback), or no_context (no retrieval)"
    EvalCase:
      type: object
      description: A single eval case. `id` is required on create today (id-optional is a known follow-up).
      required: [id, query]
      properties:
        id: { type: string }
        query: { type: string }
        expected_chunk_ids: { type: array, items: { type: string }, description: "for recall@k" }
        gold_answer: { type: string, description: "optional reference answer" }
    EvalSet:
      type: object
      description: A named set of eval cases run against an agent.
      required: [id, name, cases]
      properties:
        id: { type: string }
        name: { type: string }
        agent_id: { type: string, nullable: true }
        cases:
          type: array
          items: { $ref: '#/components/schemas/EvalCase' }
    EvalRun:
      type: object
      description: The result of running an eval set — per-case detail plus aggregate scores.
      properties:
        run_id: { type: string }
        eval_set_id: { type: string }
        ts_ms: { type: integer }
        recall_at_k: { type: number }
        faithfulness: { type: number }
        answer_relevancy: { type: number }
        pass_rate: { type: number }
        cases:
          type: array
          items:
            type: object
            properties:
              case_id: { type: string }
              recall_at_k: { type: number }
              faithfulness: { type: number }
              answer_relevancy: { type: number }
              passed: { type: boolean }
    OpsEvent:
      type: object
      description: An ops-advisor event (open or closed).
      properties:
        id: { type: string, description: "stable id = rule_id:scope-key" }
        rule_id: { type: string }
        scope:
          type: object
          description: "adjacently-tagged: { kind: global|collection|shard|node, target: ... }"
          properties:
            kind: { type: string, enum: [global, collection, shard, node] }
            target: {}
        severity: { type: string, enum: [high, medium, low] }
        status: { type: string, enum: [open, closed] }
        title: { type: string }
        detail: { type: string, description: "root cause" }
        recommendation: { type: string }
        runbook: { type: string, nullable: true }
        remediation:
          type: object
          description: "adjacently-tagged: { action: none|compact|reindex, params? }"
          properties:
            action: { type: string, enum: [none, compact, reindex] }
            params: { type: object, nullable: true }
        opened_at_ms: { type: integer }
        closed_at_ms: { type: integer, nullable: true }
        acknowledged: { type: boolean }
        remediation_note: { type: string, nullable: true }
    SloDef:
      type: object
      description: A service-level objective. `id` is optional on create (server assigns `slo-<uuid>` when omitted).
      required: [name, kind, target_pct, window_secs, fast_burn, slow_burn]
      properties:
        id: { type: string, description: "optional on create; server-assigned if omitted" }
        name: { type: string }
        kind:
          type: object
          description: |
            Internally-tagged on `kind` (snake_case): `latency` { threshold_ms },
            `availability`, `error_rate`, `synthetic` { probe_id },
            `recall` { collection, k? } (SLI from the proxy ANN recall probe),
            `faithfulness` { agent? } (SLI from a persisted faithfulness sample of converse turns).
          properties:
            kind: { type: string, enum: [latency, availability, error_rate, synthetic, recall, faithfulness] }
            threshold_ms: { type: integer, description: "latency only" }
            probe_id: { type: string, description: "synthetic only" }
            collection: { type: string, description: "recall only" }
            k: { type: integer, description: "recall only (top-k)" }
            agent: { type: string, description: "faithfulness only (optional agent filter)" }
        target_pct: { type: number, description: "objective, e.g. 99.9" }
        window_secs: { type: integer, description: "SLI compliance window" }
        fast_burn: { $ref: '#/components/schemas/BurnWindow' }
        slow_burn: { $ref: '#/components/schemas/BurnWindow' }
    BurnWindow:
      type: object
      properties:
        window_secs: { type: integer }
        threshold: { type: number, description: "burn-rate alert threshold" }
    SloStatus:
      type: object
      description: |
        Computed SLI / error-budget / burn-rate status for one SLO.
        `error_budget_remaining_pct` can go negative (over budget,
        clamped floor -1000); burn_rate 1.0 = exactly on budget, >1 = too fast.
      properties:
        sli_pct: { type: number }
        error_budget_remaining_pct: { type: number }
        burn_rate_fast: { type: number }
        burn_rate_slow: { type: number }
        breaching_fast: { type: boolean }
        breaching_slow: { type: boolean }
        budget_exhausted: { type: boolean }
        compliant: { type: boolean }
    SyntheticProbe:
      type: object
      description: An in-process synthetic self-check. `id` is optional on create (server assigns `synthetic-<uuid>` when omitted).
      required: [name, kind, interval_secs, timeout_ms]
      properties:
        id: { type: string, description: "optional on create; server-assigned if omitted" }
        name: { type: string }
        kind:
          type: object
          description: |
            Internally-tagged on `kind`: `health`, `search` { collection, query? },
            `embed` { text }.
          properties:
            kind: { type: string, enum: [health, search, embed] }
            collection: { type: string, description: "search only" }
            query: { type: string, description: "search only, optional" }
            text: { type: string, description: "embed only" }
        interval_secs: { type: integer }
        timeout_ms: { type: integer }
    ProbeResult:
      type: object
      properties:
        ts_ms: { type: integer }
        ok: { type: boolean }
        latency_ms: { type: integer }
        error: { type: string, nullable: true }
    SyntheticSummary:
      type: object
      properties:
        consecutive_failures: { type: integer }
        last_ok: { type: boolean }
        last_latency_ms: { type: integer, nullable: true }
        uptime_pct: { type: number }
        last_ts_ms: { type: integer, nullable: true }
    RuleConfigUpdate:
      type: object
      description: Partial rule config; any field may be omitted.
      properties:
        enabled: { type: boolean }
        muted: { type: boolean }
        severity_override: { type: string, enum: [high, medium, low], nullable: true }
        thresholds: { type: object, additionalProperties: true }
        auto_remediate: { type: boolean }
    ChannelsConfig:
      type: object
      description: Alert-channel config (write-only secrets). Omit a channel to leave it unset.
      properties:
        webhook:
          type: object
          properties:
            enabled: { type: boolean }
            url: { type: string }
            min_severity: { type: string, enum: [high, medium, low] }
        slack:
          type: object
          properties:
            enabled: { type: boolean }
            webhook_url: { type: string }
            min_severity: { type: string, enum: [high, medium, low] }
        pagerduty:
          type: object
          properties:
            enabled: { type: boolean }
            routing_key: { type: string }
            min_severity: { type: string, enum: [high, medium, low] }
        email:
          type: object
          properties:
            enabled: { type: boolean }
            smtp_host: { type: string }
            smtp_port: { type: integer }
            username: { type: string }
            password: { type: string }
            from: { type: string }
            to: { type: array, items: { type: string } }
            min_severity: { type: string, enum: [high, medium, low] }
    LogRecord:
      type: object
      properties:
        ts_ms: { type: integer }
        level: { type: string, enum: [ERROR, WARN, INFO, DEBUG, TRACE] }
        target: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: true }
        trace_id: { type: string, nullable: true, description: "best-effort, from the OTel span context (null when no OTLP endpoint)" }
        span_id: { type: string, nullable: true }
    LogCategory:
      type: object
      description: A semantic cluster of similar WARN/ERROR log messages.
      properties:
        id: { type: string }
        representative: { type: string }
        count: { type: integer }
        max_severity: { type: string }
        examples: { type: array, items: { type: string } }
        first_seen_ms: { type: integer }
        last_seen_ms: { type: integer }
    SlowQuery:
      type: object
      properties:
        collection: { type: string }
        ts_ms: { type: integer }
        took_ms: { type: integer }
        top_k: { type: integer }
        trace_id: { type: string, nullable: true }
    IngestLogsRequest:
      type: object
      required: [lines]
      properties:
        lines: { type: array, items: { type: string }, description: "raw log lines (JSON objects or plain text)" }
        default_level: { type: string, description: "level for lines with no detectable level (default INFO)" }
        ttl_secs: { type: integer, description: "if set, each record gets _expires_at = now + ttl_secs" }

paths:
  /v1/admin/health:
    get:
      summary: Health probe.
      description: Always 200; payload describes per-subsystem health.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /v1/admin/readiness:
    get:
      summary: Readiness probe.
      description: 200 when healthy/degraded, 503 when unhealthy.
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: unhealthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /v1/auth/login:
    post:
      summary: Issue a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/nodes:
    get:
      summary: Cluster membership view.
      description: |
        In single-node mode, returns one entry describing this
        process. In Raft mode, returns one entry per voter from
        the Raft membership configuration; the responding node's
        entry has is_self=true and accurate uptime/shard counts.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListNodesResponse' }

  /v1/admin/metrics:
    get:
      summary: Prometheus metrics scrape.
      description: |
        Plain-text Prometheus exposition format. Includes
        Veda's request counters / latencies plus the Raft
        gauges (veda_raft_term / leader_id / last_applied_index
        / last_log_index / is_leader).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            text/plain: { schema: { type: string } }

  /v1/admin/resources:
    get:
      summary: Latest node-resource snapshot (admin-only).
      description: |
        Best-effort host/process resource signals for the local node,
        from the Ops Advisor's latest snapshot (or a fresh collect when
        history is empty). Read dependency-free from /proc + statvfs on
        Linux; every field is null off-Linux/on error. Always 200.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  disk:
                    type: object
                    properties:
                      total_bytes: { type: integer, nullable: true }
                      free_bytes: { type: integer, nullable: true }
                      used_pct: { type: number, nullable: true }
                  cpu_pct: { type: number, nullable: true, description: "null until two snapshots exist" }
                  load:
                    type: object
                    properties:
                      load1: { type: number, nullable: true }
                      load5: { type: number, nullable: true }
                      load15: { type: number, nullable: true }
                  num_cpus: { type: integer }
                  fds:
                    type: object
                    properties:
                      open: { type: integer, nullable: true }
                      limit: { type: integer, nullable: true }
                  memory:
                    type: object
                    properties:
                      total_bytes: { type: integer, nullable: true }
                      available_bytes: { type: integer, nullable: true }
                  rss_bytes: { type: integer, nullable: true }

  /v1/admin/slos:
    get:
      summary: List SLO definitions (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  slos:
                    type: array
                    items: { $ref: '#/components/schemas/SloDef' }
    post:
      summary: Create or overwrite an SLO (admin-only).
      description: "The body must include an explicit `id`. Persisted; returns the stored definition."
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloDef' }
      responses:
        '200': { description: stored }

  /v1/admin/slos/{id}:
    get:
      summary: Get one SLO definition (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloDef' }
        '404': { description: no such SLO }
    put:
      summary: Update an SLO (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloDef' }
      responses:
        '200': { description: stored }
        '404': { description: no such SLO }
    delete:
      summary: Delete an SLO (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: deleted }
        '404': { description: no such SLO }

  /v1/admin/slos/{id}/status:
    get:
      summary: Current SLI / error-budget / burn-rate status for one SLO (admin-only).
      description: |
        Computed from the persisted bucketed rolling counter over the SLO's
        window and the fast/slow burn windows. `error_budget_remaining_pct`
        can go negative (over budget, clamped floor -1000); a burn_rate of
        1.0 means exactly on budget, >1 means burning too fast.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloStatus' }
        '404': { description: no such SLO }

  /v1/admin/synthetics:
    get:
      summary: List synthetic-probe definitions (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  probes:
                    type: array
                    items: { $ref: '#/components/schemas/SyntheticProbe' }
    post:
      summary: Create or overwrite a synthetic probe (admin-only).
      description: "The body must include an explicit `id`. Probes run in-process at the start of each advisor tick."
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyntheticProbe' }
      responses:
        '200': { description: stored }

  /v1/admin/synthetics/{id}:
    get:
      summary: Get one synthetic-probe definition (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyntheticProbe' }
        '404': { description: no such probe }
    put:
      summary: Update a synthetic probe (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyntheticProbe' }
      responses:
        '200': { description: stored }
        '404': { description: no such probe }
    delete:
      summary: Delete a synthetic probe (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: deleted }
        '404': { description: no such probe }

  /v1/admin/synthetics/{id}/results:
    get:
      summary: Recent results for one synthetic probe (admin-only).
      description: "The bounded per-probe ring of recent results plus the rolled-up summary."
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ProbeResult' }
                  summary: { $ref: '#/components/schemas/SyntheticSummary' }
        '404': { description: no such probe }

  /v1/admin/correlations:
    get:
      summary: Slow-query / error correlation over the query-log window (admin-only).
      description: |
        Groups the recent query-log window by collection / query_type /
        has_filter / reranked / index_type / result_count-bucket /
        top_k-bucket and returns, per bucket, count + p50 + p95 +
        slow_count + error_rate, ranked worst-first. Surfaces *which kind*
        of query is slow or failing.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        collection: { type: string }
                        query_type: { type: string }
                        has_filter: { type: boolean }
                        reranked: { type: boolean }
                        index_type: { type: string }
                        result_count_bucket: { type: string }
                        top_k_bucket: { type: string }
                        count: { type: integer }
                        p50_ms: { type: number }
                        p95_ms: { type: number }
                        slow_count: { type: integer }
                        error_rate: { type: number }

  /v1/admin/pprof:
    get:
      summary: On-demand CPU profile (admin-only).
      description: |
        Samples the running server for `seconds` at `frequency` Hz and
        returns a flamegraph SVG (`format=flamegraph`, default) or a pprof
        protobuf (`format=pprof`). 409 if a profile is already running; an
        idle server yields an empty profile (no samples) by design. Only
        present in builds compiled with the `profiling` cargo feature
        (`cargo build -p veda-server --features profiling`); otherwise 404.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: seconds, required: false, schema: { type: integer, default: 5 } }
        - { in: query, name: frequency, required: false, schema: { type: integer, default: 100 }, description: "sampling Hz" }
        - { in: query, name: format, required: false, schema: { type: string, enum: [flamegraph, pprof], default: flamegraph } }
      responses:
        '200':
          description: profile
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary, description: "pprof protobuf" }
        '409': { description: a profile is already running }
        '404': { description: built without the profiling feature }

  /v1/admin/depmap:
    get:
      summary: Declarative service dependency graph (admin-only).
      description: |
        A static topology of Veda's components: 9 nodes
        (gateway, query, shards, index, embedding, llm, rerank, blob, nats)
        and 8 directed edges. Drives the Niriksha Dependencies panel.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        kind: { type: string }
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: string }
                        to: { type: string }

  /v1/admin/index-advisor:
    get:
      summary: Per-collection ANN index advisor report (admin-only).
      description: |
        For each collection: the active index_type and params, the latest
        p95 latency, the proxy recall (`is_proxy=true` — measured against an
        exact brute-force scan over a sampled subset, not labeled ground
        truth), any directional recommendations (raise/lower efSearch,
        reindex, switch index type), and open advisor events. Recall and
        p95 are populated by the low-cadence recall probe
        (`VEDA_RECALL_PROBE_INTERVAL_SECS`).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        collection: { type: string }
                        index_type: { type: string }
                        params: { type: object, additionalProperties: true }
                        p95_ms: { type: number, nullable: true }
                        recall: { type: number, nullable: true }
                        is_proxy: { type: boolean }
                        recommendations:
                          type: array
                          items: { type: string }
                        open_events:
                          type: array
                          items: { $ref: '#/components/schemas/OpsEvent' }

  /v1/admin/change-points:
    get:
      summary: Change-point detections (admin-only).
      description: |
        Detects sustained LEVEL shifts and TREND breaks (not single-point
        anomalies) in the advisor metric series (`disk_used_pct`, `rss_bytes`,
        query `p95`, error-log count, per-collection `recall`). A pure
        least-squares / two-window statistic with a well-fit gate plus a
        warm-up (>=20 points) and a min-magnitude (1.5 sigma) guard, so it
        never fires on a flat or noisy series. Computed in-tick (no network);
        attached to the advisor snapshot's `change_points` and backed by the
        rule `change_point_detected` (Medium).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_points:
                    type: array
                    items:
                      type: object
                      properties:
                        metric: { type: string, description: "e.g. disk_used_pct / rss_bytes / p95 / error_log_count / recall" }
                        scope: { type: string, nullable: true }
                        kind: { type: string, enum: [level, trend], description: "sustained level shift vs trend break" }
                        before: { type: number, description: "pre-shift level (or slope, for a trend break)" }
                        after: { type: number, description: "post-shift level (or slope, for a trend break)" }
                        magnitude_sigma: { type: number, description: "shift size in baseline sigmas" }
                        detected_at_ms: { type: integer }

  /v1/admin/log-rate-analysis:
    get:
      summary: Semantic spike root-cause attribution (admin-only).
      description: |
        When the error/warn-log rate spikes, attributes it to the semantic
        CATEGORIES driving it by reusing the embedding `LogCategorizer` — the
        vector-native answer to a statistical log-rate analysis: it names
        *which meaning-cluster* drove the spike, not just that one occurred.
        Embedding runs off the advisor lock; a normalized-template fallback is
        used (`method` = `template`) when no embedder is configured.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: window_secs, required: false, schema: { type: integer }, description: "the spike window to analyze" }
        - { in: query, name: baseline_secs, required: false, schema: { type: integer }, description: "the baseline window to compare against" }
        - { in: query, name: min_level, required: false, schema: { type: string, enum: [warn, error] }, description: "minimum log level to include" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: integer, description: "analyzed spike-window seconds" }
                  baseline: { type: integer, description: "baseline-window seconds" }
                  total_delta: { type: integer, description: "spike-count minus baseline-count over the categories" }
                  method: { type: string, enum: [embedding, template], description: "embedding clustering, or normalized-template fallback" }
                  drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        representative: { type: string }
                        spike_count: { type: integer }
                        baseline_count: { type: integer }
                        growth: { type: number, description: "spike/baseline growth ratio" }
                        share_of_growth: { type: number, description: "this category's fraction of total_delta" }
                        is_new: { type: boolean, description: "category not present in the baseline window" }

  /v1/admin/incidents:
    get:
      summary: Semantic incident clusters (admin-only).
      description: |
        Ops-event title+detail are embedded and clustered by cosine into
        incidents (rule_id+scope fallback when no embedder is configured), so
        a storm of related events collapses into one incident. Produced by an
        off-tick runner (`VEDA_INCIDENT_INTERVAL_SECS`, default 300). On a
        newly-correlated incident the `veda-ops` agent best-effort drafts a
        root-cause paragraph + runbook step into `draft` (None without an
        LLM), and the incident is scored for embedding-based novelty
        (`is_novel` / `novelty_score`). The response also carries a
        `noise_reduction` summary (N alerts collapsed to one incident).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items:
                      type: object
                      properties:
                        representative: { type: string, description: "the representative event title/detail" }
                        member_event_ids: { type: array, items: { type: string } }
                        rule_ids: { type: array, items: { type: string } }
                        count: { type: integer }
                        max_severity: { type: string, enum: [high, medium, low] }
                        first_seen: { type: integer }
                        last_seen: { type: integer }
                        draft: { type: string, nullable: true, description: "veda-ops-drafted root-cause paragraph + runbook step; null without an LLM or for a non-new incident" }
                        is_novel: { type: boolean, description: "true when the incident is an unprecedented pattern (warm-up >=5 historical incidents; false when skipped)" }
                        novelty_score: { type: number, nullable: true, description: "1 - max cosine similarity to incident history; null when no embedder or below warm-up" }
                  noise_reduction:
                    type: object
                    description: "alert-storm noise-reduction summary (notify per incident, not per event)"
                    properties:
                      event_count: { type: integer }
                      incident_count: { type: integer }
                      suppressed: { type: integer, description: "event_count - incident_count" }

  /v1/admin/llm-traces:
    get:
      summary: Semantic search over the LLM trace store (admin-only).
      description: |
        Searches the per-tenant `_llm_traces` collection — populated when an
        agent has tracing enabled (opt-in `Agent.trace`) — by embedding the
        query `q` and vector-searching the stored prompt+response embeddings.
        Each trace carries the prompt, response, tool ids, faithfulness,
        cost (USD), cache_hit, guardrail_flagged, latency, and timestamp.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: q, required: false, schema: { type: string }, description: "semantic query over prompt+response; omitted → most recent traces" }
        - { in: query, name: limit, required: false, schema: { type: integer }, description: "max traces to return" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  traces:
                    type: array
                    items:
                      type: object
                      properties:
                        prompt: { type: string }
                        response: { type: string }
                        tool_ids: { type: array, items: { type: string } }
                        faithfulness: { type: number, nullable: true }
                        cost_usd: { type: number, nullable: true }
                        cache_hit: { type: boolean }
                        guardrail_flagged: { type: boolean }
                        latency_ms: { type: integer }
                        ts: { type: integer }
                        score: { type: number, description: "cosine similarity to the query (when q is given)" }

  /v1/admin/llm-traces/clusters:
    get:
      summary: Failure clustering over the LLM trace store (admin-only).
      description: |
        Clusters failing/low-quality traces in `_llm_traces` into recurring
        failure modes by reusing the embedding categorizer (a normalized
        fallback when no embedder is configured), so a class of bad answers
        surfaces as one cluster rather than many individual traces.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        representative: { type: string, description: "a representative prompt/response from the cluster" }
                        count: { type: integer }

  /v1/collections/{name}/ingest-url:
    post:
      summary: Ingest one or more web URLs into a collection via crawl4ai (tenant-scoped).
      description: |
        Crawls the given URL(s) through the configured crawl4ai service
        (`POST {VEDA_CRAWL4AI_ENDPOINT}/crawl` → clean markdown) and runs the
        shared chunk → embed → insert path (`ingest_markdown`, the same path
        `process-document` uses). Inserted records carry `source_url`, `title`,
        and `chunk_index`. Opt-in and **tenant/RLS-scoped**: returns **503**
        when crawl4ai is unconfigured (endpoint unset). `deep_crawl` follows
        in-domain links up to `max_pages`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string }, description: collection name }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Provide exactly one of `url` or `urls`."
              properties:
                url: { type: string, description: "a single URL to crawl" }
                urls: { type: array, items: { type: string }, description: "multiple URLs to crawl" }
                deep_crawl: { type: boolean, description: "follow in-domain links (bounded by max_pages)" }
                max_pages: { type: integer, description: "cap on pages fetched during a deep crawl" }
                chunker: { type: string, description: "override chunking strategy (else the collection default)" }
                ttl_secs: { type: integer, description: "optional record TTL → reserved `_expires_at`" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages: { type: integer, description: "URLs/pages crawled" }
                  chunks: { type: integer, description: "chunks inserted" }
                  records: { type: integer, description: "records inserted" }
        '404': { description: collection not found }
        '503': { description: crawl4ai not configured (VEDA_CRAWL4AI_ENDPOINT unset) }

  /v1/admin/connectors:
    get:
      summary: List data-source connectors (admin-only, tenant-scoped).
      description: |
        Connectors are persisted via SavedObjects and scoped to the caller's
        tenant. A connector is `{ id, kind: web|websearch, name, config,
        enabled }`.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items: { $ref: '#/components/schemas/Connector' }
    post:
      summary: Create a data-source connector (admin-only).
      description: |
        Creates a connector. `id` is optional on create — when omitted the
        server assigns `conn-{uuid}`.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connector' }
      responses:
        '200':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '400': { description: bad request }

  /v1/admin/connectors/{id}:
    get:
      summary: Get a connector by id (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '404': { description: connector not found }
    put:
      summary: Update a connector (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connector' }
      responses:
        '200': { description: updated }
        '404': { description: connector not found }
    delete:
      summary: Delete a connector (admin-only, idempotent).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/admin/connectors/{id}/run:
    post:
      summary: Run a connector now (admin-only).
      description: |
        Runs the connector once. A `web` connector crawls its configured URLs
        into its target collection (reusing the `crawl_and_ingest` path behind
        `/ingest-url`). Returns **503** when crawl4ai is unconfigured.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages: { type: integer }
                  chunks: { type: integer }
                  records: { type: integer }
        '404': { description: connector not found }
        '503': { description: crawl4ai not configured }

  /v1/admin/forecast:
    get:
      summary: Capacity forecasts (admin-only).
      description: |
        Least-squares trend over the snapshot history projects
        threshold-crossing ETAs (disk-full date, memory exhaustion, recall
        decay) with warm-up and min-R² guards so it never fires on a flat or
        noisy series. Backs the rules `disk_full_forecast` (High),
        `memory_growth_forecast` (Medium), and `recall_decay_forecast`
        (Medium).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecasts:
                    type: array
                    items:
                      type: object
                      properties:
                        metric: { type: string, description: "e.g. disk_used / memory / recall" }
                        scope: { type: string, nullable: true }
                        slope_per_sec: { type: number }
                        r_squared: { type: number }
                        threshold: { type: number }
                        eta_ms: { type: integer, nullable: true, description: "projected threshold-crossing time; null if not trending toward it" }

  /v1/admin/cluster/join:
    post:
      summary: Add a voter to the Raft cluster.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, address]
              properties:
                node_id: { type: integer }
                address: { type: string }
      responses:
        '201': { description: voter added }
        '503': { description: raft not configured }

  /v1/admin/cluster/nodes/{id}:
    delete:
      summary: Remove a voter from the Raft cluster.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: voter removed }
        '503': { description: raft not configured }

  /v1/admin/cluster/noop:
    post:
      summary: Submit a Raft Noop command (debugging / load gen).
      security: [ { bearerAuth: [] } ]
      responses:
        '201': { description: committed }
        '503': { description: raft not configured }

  /v1/collections:
    get:
      summary: List collections on this node.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
    post:
      summary: Create a collection.
      description: |
        In Raft mode, this submits a `CreateCollection`
        command through the consensus log; the response only
        returns after the entry commits + applies on this node.

        Set `external` instead of `fields` to register a **read-in-place
        Parquet collection** — see `CreateCollectionRequest.external` for
        the full set of known limitations. `GET` on such a collection
        additionally returns `external_dimension`, `external_row_count`,
        and `external_skipped_columns` (scalar columns dropped at
        registration because their Arrow type has no mapping).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCollectionRequest' }
      responses:
        '201': { description: created }
        '307': { description: "follower; resubmit at Location header" }
        '400': { description: "invalid request, including external-registration validation failures (missing/wrong-typed column, dimension disagreement across files, unreadable or bucket-naming URI)" }
        '409': { description: already exists }

  /v1/collections/{name}:
    get:
      summary: Describe a collection.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    delete:
      summary: Drop a collection.
      description: |
        Raft-routed in raft mode. Same 307 redirect behaviour on
        followers as POST /v1/collections.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: dropped }
        '307': { description: "follower; resubmit at Location header" }
        '404': { description: not found }

  /v1/collections/{name}/insert:
    post:
      summary: Insert one or more records.
      description: |
        Inserts records into the collection. Per-shard routing
        via ShardRouter. The response `ids` array contains the
        assigned UUID for each record.

        `405` on an external (read-in-place Parquet) collection — it is
        read-only, along with 17 other mutating endpoints (embed-insert,
        delete, reindex, rescan-guardrails, seal, optimize,
        process-document, process-documents batch, ingest-url,
        ingest-media, ingest-logs, mvcc-checkpoint, the tuning-campaign
        start/apply-trial routes, connector run, eval-set generation, and
        auto-optimization). Dropping the collection and alias management
        are unaffected.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsertRequest' }
      responses:
        '201':
          description: inserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsertResponse' }
        '307': { description: "follower; resubmit at Location header" }
        '404': { description: collection not found }
        '405': { description: "collection is external and read-only" }

  /v1/collections/{name}/records/{id}:
    get:
      summary: Fetch a record by id.
      description: |
        Append `?linearisable=true` in raft mode to issue a
        `Noop` barrier write before reading from the Raft state
        machine instead of the local SegmentManager. One extra
        Raft round-trip; guarantees the response reflects every
        Insert that committed before this request arrived.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: linearisable
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: at
          required: false
          schema: { type: string }
          description: |
            MVCC snapshot timestamp. Same format as the search
            `?at=` parameter: raw u128 HLC or relative expression
            (`now`, `now-1h`, `now-30m`, `now-5s`).
      responses:
        '200': { description: ok }
        '404': { description: not found }

  /v1/collections/{name}/records:
    get:
      summary: List records in a collection.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: at
          required: false
          schema: { type: string }
          description: |
            MVCC snapshot timestamp. Same format as the search
            `?at=` parameter: raw u128 HLC or relative expression
            (`now`, `now-1h`, `now-30m`, `now-5s`).
      responses:
        '200': { description: ok }
    delete:
      summary: Delete records by filter.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/collections/{name}/ingest-logs:
    post:
      summary: Ingest raw log lines as records (searchable log archive).
      description: |
        Parses each line (JSON object or plain text) into a record with
        `message`, `level`, `ts` (+ optional `_expires_at` from `ttl_secs`),
        and inserts via the insert / embed-insert path (auto-embeds
        `message` when the collection has an `auto_embed` vector field).
        Recommended schema: `message` (string, bm25), `level` (string,
        filterable), `ts` (int64, filterable), optional `embedding`
        (vector, auto_embed source=message). Same auth/tenant as `/insert`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestLogsRequest' }
      responses:
        '201':
          description: ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested: { type: integer }
        '404': { description: collection not found }

  /v1/collections/{name}/search:
    post:
      summary: Search a collection.
      description: |
        Dense, sparse, BM25, match_phrase, hybrid, colpali, multi_vector.
        The scalar `filter` (and row-level security) applies to ALL
        paths including the lexical (BM25/match_phrase/hybrid) ones.

        **External (read-in-place Parquet) collections support `vector`
        search and scalar `filter` only.** `bm25`, `match_phrase`,
        `sparse_vector`, `hybrid` and `rerank` all return `400` naming
        the missing index/data. `explain` and `truncate_to` are silently
        ignored rather than rejected (see `SearchRequest`), and a hit's
        row id appears both as `SearchHit.id` and again inside
        `SearchHit.fields` (see `SearchHit`). Two other entry points do
        not support external collections at all: auto-tuning campaigns
        reject them cleanly with `405`, and the agent/MCP retrieval tool
        fails with a generic internal error rather than an explained
        rejection. Full detail:
        `documentation/2026-08-14-external-parquet-collections-design.md`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: at
          required: false
          schema: { type: string }
          description: |
            MVCC snapshot timestamp. Accepts a raw u128 HLC value
            (encoding: `(physical_ns << 32) | logical`) or a relative
            expression: `now`, `now-1h`, `now-30m`, `now-5s`. When
            omitted, reads the latest committed state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { description: "on an external collection: an unsupported query type (bm25/match_phrase/sparse_vector/hybrid/rerank), naming the missing index or data" }
        '503': { description: "external collection's source is unreadable or has disappeared since registration" }

  /v1/collections/{name}/coverage:
    get:
      summary: Coverage / orphan-chunk rollup.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, default: 7d, description: "1h|24h|7d|30d|<N><unit>" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageResponse' }

  /v1/embed:
    post:
      summary: Embed text or image to a vector.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/llm/complete:
    post:
      summary: OpenAI-compatible chat-completion proxy.
      description: |
        Used by the dashboard's cluster-labels, NL→DSL agent,
        and failure-mode classifier. Returns 503 when no LLM
        endpoint is configured.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
        '503': { description: LLM not configured }

  /v1/chunk/preview:
    post:
      summary: Compare chunking strategies on a single text.
      description: |
        Pure dry-run — no storage / no embedding. Used by the
        Chunker A/B page in Niriksha.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChunkPreviewRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkPreviewResponse' }
        '400': { description: invalid request }

  /v1/route:
    post:
      summary: Adaptive query router — recommends Dense / Sparse / BM25 / Hybrid.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/mcp:
    post:
      summary: Model Context Protocol endpoint (JSON-RPC 2.0, protocol 2025-06-18).
      description: |
        Stateless Streamable-HTTP MCP transport. Methods: `initialize`,
        `tools/list`, `tools/call`, `ping`. `tools/list` returns the full
        8-tool catalog with annotations; `tools/call` returns
        `structuredContent` on success and `isError: true` for tool-level
        errors. Honors the optional `MCP-Protocol-Version` header
        (unsupported value → 400). Desktop stdio clients connect via the
        `veda-mcp` bridge binary.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: header
          name: MCP-Protocol-Version
          required: false
          schema: { type: string, enum: ["2025-06-18", "2025-03-26"] }
      responses:
        '200': { description: JSON-RPC response (application/json) }
        '400': { description: unsupported MCP-Protocol-Version }
    get:
      summary: Not supported (no server-initiated stream).
      description: Veda's MCP server has no server→client stream; GET returns 405.
      security: [ { bearerAuth: [] } ]
      responses:
        '405': { description: "method not allowed (Allow: POST)" }

  /v1/agents:
    get:
      summary: List agents.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: Create or upsert an agent (empty id → generated).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        '200': { description: stored }

  /v1/agents/{id}:
    get:
      summary: Fetch an agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    put:
      summary: Upsert an agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        '200': { description: stored }
    delete:
      summary: Delete an agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/agents/{id}/converse:
    post:
      summary: Converse with an agent (sync multi-step tool-calling loop).
      description: |
        Runs the agent's ReAct-style loop over the configured LLM and
        returns the final answer plus a full `steps[]` trace. Resolves the
        built-in `veda-agent` when no agent with that id exists. Returns
        503 when no LLM endpoint is configured.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConverseRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConverseResponse' }
        '404': { description: agent not found }
        '503': { description: no LLM configured }

  /v1/agents/{id}/converse/stream:
    post:
      summary: Converse with an agent, streamed over Server-Sent Events.
      description: |
        Runs the same ReAct-style loop as `/converse` but streams progress as
        SSE frames — `event: reasoning | tool_call | tool_result | answer`
        deltas as the loop runs, then a terminal `event: done` whose data is
        `{ conversation_id, response, metrics, citations, grounding }`.
        Tenant-scoped; row-level security is enforced through tool calls via
        the caller's identity. Returns 503 when no LLM endpoint is configured.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConverseRequest' }
      responses:
        '200':
          description: SSE stream of reasoning/tool_call/tool_result/answer events then a final done event.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { description: agent not found }
        '503': { description: no LLM configured }

  /v1/eval-sets:
    get:
      summary: List eval sets (tenant-scoped).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvalSet' }
    post:
      summary: Create or overwrite an eval set (tenant-scoped).
      description: An explicit `id` is required in the body today (id-optional is a known follow-up).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalSet' }
      responses:
        '200': { description: stored }
        '400': { description: bad request }

  /v1/eval-sets/{id}:
    get:
      summary: Get an eval set.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalSet' }
        '404': { description: not found }
    delete:
      summary: Delete an eval set (idempotent).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/eval-sets/{id}/run:
    post:
      summary: Run an eval set and score recall@k / faithfulness / answer-relevancy / pass_rate.
      description: |
        Runs every case through the agent and returns per-case + aggregate
        scores. Returns 503 when no LLM endpoint is configured.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRun' }
        '404': { description: not found }
        '503': { description: no LLM configured }

  /v1/eval-sets/{id}/runs:
    get:
      summary: List past runs for an eval set.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvalRun' }
        '404': { description: not found }

  /v1/eval-sets/{id}/cases/from-conversation:
    post:
      summary: Graduate a production conversation trace into a regression case (the flywheel).
      description: |
        Adds a new `EvalCase` to the eval set derived from a recorded
        conversation (its query, retrieved chunk ids as `expected_chunk_ids`,
        and the produced answer as `gold_answer`).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id]
              properties:
                conversation_id: { type: string }
                case_id: { type: string, description: "id for the new case (required today)" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalCase' }
        '404': { description: eval set or conversation not found }

  /v1/agent-tools:
    get:
      summary: List user-defined custom tools.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: Create or upsert a custom tool.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTool' }
      responses:
        '200': { description: stored }

  /v1/agent-tools/catalog:
    get:
      summary: List built-in tool specs (id, description, inputSchema, annotations).
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/agent-tools/{id}:
    get:
      summary: Fetch a custom tool.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    put:
      summary: Upsert a custom tool.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTool' }
      responses:
        '200': { description: stored }
    delete:
      summary: Delete a custom tool.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/agent-tools/{id}/execute:
    post:
      summary: Invoke one built-in tool directly.
      description: |
        Body is the tool arguments, either wrapped as `{ "args": {...} }`
        or the args object directly. Tenant + RLS apply. Error mapping:
        invalid args → 400, not found → 404, internal → 500.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: tool result content }
        '400': { description: invalid args }
        '404': { description: tool or target not found }

  /v1/conversations:
    get:
      summary: List conversations.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/conversations/{id}:
    get:
      summary: Fetch a conversation (messages + step trace).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    delete:
      summary: Delete a conversation.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/conversations/{id}/feedback:
    post:
      summary: Submit thumbs feedback on a conversation (tenant-scoped).
      description: |
        Records an up/down rating (with an optional note) for a conversation
        and increments `veda_llm_feedback_total{rating}`. Tenant-scoped; the
        conversation must belong to the caller's tenant.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [up, down] }
                note: { type: string, nullable: true }
      responses:
        '204': { description: recorded }
        '404': { description: conversation not found }

  /v1/a2a/{agent_id}/card:
    get:
      summary: A2A AgentCard for discovery (skills = the agent's tools).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: agent_id, required: true, schema: { type: string } }
      responses:
        '200': { description: A2A AgentCard JSON }
        '404': { description: agent not found }

  /v1/a2a/{agent_id}:
    post:
      summary: A2A JSON-RPC endpoint (method message/send, sync).
      description: |
        Runs a one-shot agent turn over the user message's text parts and
        returns the agent's reply as an A2A Message. Unknown method → JSON-RPC
        -32601; no LLM → 503.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: agent_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "JSON-RPC 2.0 envelope with method message/send." }
      responses:
        '200': { description: JSON-RPC result (A2A Message) }
        '404': { description: agent not found }
        '503': { description: no LLM configured }

  /v1/saved_objects:
    get:
      summary: List server-side SavedObjects.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/admin/logs:
    get:
      summary: Recent captured logs from the in-process buffer (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: level, required: false, schema: { type: string, enum: [ERROR, WARN, INFO, DEBUG, TRACE] } }
        - { in: query, name: q, required: false, schema: { type: string, description: "substring filter over message + target" } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 200 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: { type: array, items: { $ref: '#/components/schemas/LogRecord' } }

  /v1/admin/logs/categories:
    get:
      summary: Semantic categories of recent WARN/ERROR logs (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { $ref: '#/components/schemas/LogCategory' } }

  /v1/admin/slow-queries:
    get:
      summary: Slowest recent queries, server-backed from the query log (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: collection, required: false, schema: { type: string, description: "omit to scan all tenant collections" } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  slow_queries: { type: array, items: { $ref: '#/components/schemas/SlowQuery' } }

  /v1/admin/insights:
    get:
      summary: List open ops-advisor events (admin-only).
      description: |
        Open events from the advisor, sorted by severity. Optional
        `?severity=` and `?scope=` filters. Each event has a severity
        (high/medium/low), root-cause detail, and a recommendation.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: severity
          required: false
          schema: { type: string, enum: [high, medium, low] }
        - in: query
          name: scope
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/OpsEvent' }

  /v1/admin/insights/history:
    get:
      summary: List closed ops-advisor events (admin-only, bounded).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/OpsEvent' }

  /v1/admin/insights/rules:
    get:
      summary: List the rule catalog with effective config (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: "each item: { id, default_severity?, anomaly, effective_config }"

  /v1/admin/insights/rules/{id}:
    put:
      summary: Tune a rule (admin-only).
      description: |
        Partial update: any of `enabled`, `muted`, `severity_override`,
        `thresholds` (object), `auto_remediate`. Persisted; returns the
        effective config.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleConfigUpdate' }
      responses:
        '200': { description: effective config }

  /v1/admin/insights/channels:
    get:
      summary: Alert-channel config, secrets redacted (admin-only).
      description: "Returns per-channel { configured, enabled, min_severity } (+ non-secret email bits). Secrets (urls/keys/passwords) are never returned."
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: redacted channel config }
    put:
      summary: Set alert-channel config (admin-only; secrets write-only).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelsConfig' }
      responses:
        '200': { description: stored }

  /v1/admin/insights/run:
    post:
      summary: Force one advisor evaluation tick (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened: { type: integer }
                  closed: { type: integer }

  /v1/admin/insights/{event_id}/ack:
    post:
      summary: Acknowledge an open event (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
      responses:
        '200': { description: acknowledged }
        '404': { description: no such open event }

  /v1/admin/insights/{event_id}/triage:
    post:
      summary: AI triage of an ops-advisor event (admin-only).
      description: |
        Runs the built-in read-only `veda-ops` agent over the event. The
        agent autonomously calls the 4 ops tools (get_insights, get_logs,
        get_resources, get_slo_status) and returns a grounded explanation
        plus next steps. Returns 503 when no LLM is configured
        (VEDA_LLM_ENDPOINT unset), 404 when the event is unknown.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id: { type: string }
                  explanation: { type: string }
                  steps:
                    type: array
                    items: { $ref: '#/components/schemas/AgentStep' }
                  metrics: { $ref: '#/components/schemas/RunMetrics' }
                  citations:
                    type: array
                    items: { $ref: '#/components/schemas/Citation' }
                  grounding: { $ref: '#/components/schemas/Grounding' }
        '404': { description: no such event }
        '503': { description: no LLM configured }

  /v1/admin/insights/{event_id}/rca:
    get:
      summary: Cross-signal root-cause bundle for an event (admin-only).
      description: |
        Joins, for one event, the correlated logs + the slow/errored queries +
        the traces (by `trace_id` and the event time window) + the nearest
        resource snapshot + the related incident into a single bundle. The
        same join the `correlate_incident` ops tool exposes to the `veda-ops`
        triage agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/OpsEvent' }
                  logs:
                    type: array
                    items: { type: object, additionalProperties: true }
                  queries:
                    type: array
                    description: slow / errored queries in the event window
                    items: { type: object, additionalProperties: true }
                  traces:
                    type: array
                    items: { type: object, additionalProperties: true }
                  resource_snapshot: { type: object, additionalProperties: true, nullable: true }
                  incident: { type: object, additionalProperties: true, nullable: true }
        '404': { description: no such event }

  /v1/admin/jobs:
    get:
      summary: List scheduled jobs (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/JobResponse' }
    post:
      summary: Register or overwrite a scheduled job (admin-only).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '201': { description: registered }
        '400': { description: invalid cron expression }

  /v1/admin/jobs/{name}:
    delete:
      summary: Remove a scheduled job by name (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '204': { description: removed }
        '404': { description: not found }

  /v1/collections/{name}/aggregate:
    get:
      summary: Scalar aggregation over a field, with optional grouping.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: field
          required: true
          schema: { type: string }
        - in: query
          name: metric
          required: true
          schema: { type: string, enum: [count, sum, avg, min, max] }
        - in: query
          name: group_by
          required: false
          schema: { type: string }
        - in: query
          name: filter
          required: false
          schema: { type: string, description: "SQL-like filter DSL (RLS-injected when configured)." }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateResponse' }
        '400': { description: "non-numeric field for a numeric metric, or invalid filter" }
        '404': { description: collection not found }

  /v1/collections/{name}/histogram:
    get:
      summary: Equal-width numeric histogram over a field.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: field
          required: true
          schema: { type: string }
        - in: query
          name: bins
          required: false
          schema: { type: integer, default: 10 }
        - in: query
          name: filter
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistogramResponse' }
        '404': { description: collection not found }

  /v1/collections/{name}/field-stats:
    get:
      summary: Per-field statistics (counts, cardinality, numeric/string summaries).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: field
          required: true
          schema: { type: string }
        - in: query
          name: filter
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldStatsResponse' }
        '404': { description: collection not found }

  /v1/saved_objects/{id}:
    put:
      summary: Upsert a SavedObject (search, atlas, eval, dashboard, ...).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: stored }
        '400': { description: bad request }
    delete:
      summary: Delete a SavedObject (idempotent).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: removed }
