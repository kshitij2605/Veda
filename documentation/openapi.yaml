openapi: 3.0.3
info:
  title: Veda REST API
  version: 0.1.0
  description: |
    REST API exposed by `veda-gateway`. The shape mirrors what
    `crates/veda-gateway/src/rest/` actually serves; this file is
    hand-maintained rather than generated, so when adding a route
    update the relevant section here. Routes prefixed `/v1/admin`
    require the bearer token when `auth_enabled=true`.

    Conventions:
      - All bodies are JSON unless noted.
      - Standard error envelope: `{ "error": "<message>" }`.
      - When the gateway is in Raft mode and the caller hits a
        follower for a mutating request, the response is a
        `307 Temporary Redirect` with `Location:` pointing at
        the current leader.

servers:
  - url: http://localhost:6340
    description: default single-node dev port
  - url: http://localhost:6342
    description: node-2 in the 3-node raft-cluster compose profile
  - url: http://localhost:6344
    description: node-3 in the 3-node raft-cluster compose profile

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
    NodeInfo:
      type: object
      properties:
        id: { type: string }
        address: { type: string }
        role: { type: string, enum: [leader, follower, candidate, unknown] }
        status: { type: string }
        version: { type: string }
        uptime_secs: { type: integer }
        shard_count: { type: integer }
        collection_count: { type: integer }
        is_self: { type: boolean }
    ListNodesResponse:
      type: object
      properties:
        mode: { type: string, enum: [single, raft] }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeInfo' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
    FieldDef:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [vector, string, int64, float64, bool, blob, sparse]
        dimension: { type: integer, description: "Required for vector type" }
        metric:
          type: string
          enum: [cosine, dot_product, euclidean, manhattan]
        filterable: { type: boolean }
    CreateCollectionRequest:
      type: object
      required: [name, fields]
      properties:
        name: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDef' }
        shard_count: { type: integer, default: 1 }
        replication_factor: { type: integer, default: 1 }
        rls_owner_field:
          type: string
          nullable: true
          description: |
            Row-level security. When set, names the record field that
            holds the owner. The gateway then AND-injects
            `<rls_owner_field> == <jwt-subject>` into every read filter
            and enforces owner-on-write at the AST level. Admin bypasses.
    InsertRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { type: object, additionalProperties: true }
    InsertResponse:
      type: object
      properties:
        inserted: { type: integer }
        ids:
          type: array
          items: { type: string }
          description: "Per-record UUIDs assigned by the gateway. Always populated."
    SearchHit:
      type: object
      properties:
        id: { type: string }
        distance: { type: number }
        fields:
          type: object
          additionalProperties: true
    SearchRequest:
      type: object
      required: [query, limit]
      properties:
        query:
          type: object
          description: |
            One of `vector`, `bm25`, `sparse_vector`, `hybrid`,
            `colpali`, `multi_vector` — see the Rust types in
            `crates/veda-gateway/src/rest/search.rs`.
        filter:
          type: string
          description: |
            SQL-like filter DSL. Supports dotted paths into nested JSON
            fields, e.g. `meta.user.tier = "gold"`.
        limit: { type: integer }
        explain: { type: boolean }
        truncate_to: { type: integer, nullable: true }
        rerank:
          type: object
          nullable: true
          properties:
            field: { type: string }
            query: { type: string }
            top_k: { type: integer }
            model: { type: string, nullable: true }
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        count: { type: integer }
        took_ms: { type: integer }
        explain: { type: object, nullable: true }
        hybrid_explain: { type: object, nullable: true }
    ChunkPreviewRequest:
      type: object
      required: [text, runs]
      properties:
        text: { type: string }
        runs:
          type: array
          items:
            type: object
            required: [strategy_name]
            properties:
              label: { type: string }
              strategy_name: { type: string }
              chunk_size: { type: integer }
              chunk_overlap: { type: integer }
    ChunkPreviewResponse:
      type: object
      properties:
        input_chars: { type: integer }
        runs:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              strategy_name: { type: string }
              elapsed_ms: { type: number }
              total_chunks: { type: integer }
              total_chars: { type: integer }
              avg_chars: { type: number }
              min_chars: { type: integer }
              max_chars: { type: integer }
              truncated: { type: boolean }
              chunks:
                type: array
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    text: { type: string }
                    char_count: { type: integer }
                    start_offset: { type: integer }
                    end_offset: { type: integer }
                    heading_path:
                      type: array
                      items: { type: string }
                    page_number: { type: integer, nullable: true }
    CoverageResponse:
      type: object
      properties:
        window_secs: { type: integer }
        total_queries: { type: integer }
        total_chunks: { type: integer }
        retrieved_chunks: { type: integer }
        orphan_count: { type: integer }
        top_hits:
          type: array
          items:
            type: object
            properties:
              doc_id: { type: string }
              count: { type: integer }
              fraction: { type: number }
        orphan_sample:
          type: array
          items: { type: string }
    CreateJobRequest:
      type: object
      required: [name, cron, kind]
      properties:
        name: { type: string, description: "Unique job name; re-registering overwrites." }
        cron: { type: string, description: "Cron expression (validated by the `cron` crate)." }
        kind:
          type: object
          description: |
            Tagged `JobKind`. Exactly one of `TtlSweep`, `Reindex`,
            `Compact`, `Evaluate`, each carrying `{ collection }`.
            e.g. `{ "TtlSweep": { "collection": "docs" } }`. Only
            `TtlSweep` is wired to an action today.
    JobResponse:
      type: object
      properties:
        name: { type: string }
        cron: { type: string }
        kind: { type: object }
        last_run: { type: integer, nullable: true, description: "Unix seconds of the last dispatch." }
    AggregateResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: "Group value (empty string when no group_by)." }
              value: { type: number }
    HistogramResponse:
      type: object
      properties:
        bins:
          type: array
          items:
            type: object
            properties:
              lo: { type: number }
              hi: { type: number }
              count: { type: integer }
    FieldStatsResponse:
      type: object
      properties:
        field: { type: string }
        total_count: { type: integer }
        null_count: { type: integer }
        cardinality: { type: integer }
        min: { type: number, nullable: true, description: "Numeric fields only." }
        max: { type: number, nullable: true, description: "Numeric fields only." }
        avg: { type: number, nullable: true, description: "Numeric fields only." }
        min_length: { type: integer, nullable: true, description: "String fields only." }
        max_length: { type: integer, nullable: true, description: "String fields only." }
    Agent:
      type: object
      required: [name]
      properties:
        id: { type: string, description: "Omit/empty on create to auto-generate." }
        name: { type: string }
        description: { type: string }
        instructions: { type: string, description: "System prompt for the agent." }
        tool_ids:
          type: array
          items: { type: string }
          description: "Tool ids this agent may call; empty = all builtins."
        model:
          type: object
          nullable: true
          description: "Per-agent LLM override; null = global VEDA_LLM config."
          properties:
            endpoint: { type: string, nullable: true }
            model: { type: string, nullable: true }
    AgentTool:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, description: "Interpreted by the tool catalog." }
        config: { type: object, additionalProperties: true }
    ConverseRequest:
      type: object
      required: [input]
      properties:
        input: { type: string }
        conversation_id: { type: string, nullable: true, description: "Continue an existing conversation; omit to start a new one." }
        attachments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              kind: { type: string }
              data_b64: { type: string, nullable: true }
    AgentStep:
      type: object
      description: |
        One trace step, discriminated by `kind`:
        `reasoning` { text }, `tool_call` { tool_call_id, tool_id, args },
        `tool_result` { tool_call_id, result, is_error }.
      properties:
        kind: { type: string, enum: [reasoning, tool_call, tool_result] }
        text: { type: string }
        tool_call_id: { type: string }
        tool_id: { type: string }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        is_error: { type: boolean }
    ConverseResponse:
      type: object
      properties:
        conversation_id: { type: string }
        response: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
    OpsEvent:
      type: object
      description: An ops-advisor event (open or closed).
      properties:
        id: { type: string, description: "stable id = rule_id:scope-key" }
        rule_id: { type: string }
        scope:
          type: object
          description: "adjacently-tagged: { kind: global|collection|shard|node, target: ... }"
          properties:
            kind: { type: string, enum: [global, collection, shard, node] }
            target: {}
        severity: { type: string, enum: [high, medium, low] }
        status: { type: string, enum: [open, closed] }
        title: { type: string }
        detail: { type: string, description: "root cause" }
        recommendation: { type: string }
        runbook: { type: string, nullable: true }
        remediation:
          type: object
          description: "adjacently-tagged: { action: none|compact|reindex, params? }"
          properties:
            action: { type: string, enum: [none, compact, reindex] }
            params: { type: object, nullable: true }
        opened_at_ms: { type: integer }
        closed_at_ms: { type: integer, nullable: true }
        acknowledged: { type: boolean }
        remediation_note: { type: string, nullable: true }
    RuleConfigUpdate:
      type: object
      description: Partial rule config; any field may be omitted.
      properties:
        enabled: { type: boolean }
        muted: { type: boolean }
        severity_override: { type: string, enum: [high, medium, low], nullable: true }
        thresholds: { type: object, additionalProperties: true }
        auto_remediate: { type: boolean }
    ChannelsConfig:
      type: object
      description: Alert-channel config (write-only secrets). Omit a channel to leave it unset.
      properties:
        webhook:
          type: object
          properties:
            enabled: { type: boolean }
            url: { type: string }
            min_severity: { type: string, enum: [high, medium, low] }
        slack:
          type: object
          properties:
            enabled: { type: boolean }
            webhook_url: { type: string }
            min_severity: { type: string, enum: [high, medium, low] }
        pagerduty:
          type: object
          properties:
            enabled: { type: boolean }
            routing_key: { type: string }
            min_severity: { type: string, enum: [high, medium, low] }
        email:
          type: object
          properties:
            enabled: { type: boolean }
            smtp_host: { type: string }
            smtp_port: { type: integer }
            username: { type: string }
            password: { type: string }
            from: { type: string }
            to: { type: array, items: { type: string } }
            min_severity: { type: string, enum: [high, medium, low] }
    LogRecord:
      type: object
      properties:
        ts_ms: { type: integer }
        level: { type: string, enum: [ERROR, WARN, INFO, DEBUG, TRACE] }
        target: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: true }
        trace_id: { type: string, nullable: true, description: "best-effort, from the OTel span context (null when no OTLP endpoint)" }
        span_id: { type: string, nullable: true }
    LogCategory:
      type: object
      description: A semantic cluster of similar WARN/ERROR log messages.
      properties:
        id: { type: string }
        representative: { type: string }
        count: { type: integer }
        max_severity: { type: string }
        examples: { type: array, items: { type: string } }
        first_seen_ms: { type: integer }
        last_seen_ms: { type: integer }
    SlowQuery:
      type: object
      properties:
        collection: { type: string }
        ts_ms: { type: integer }
        took_ms: { type: integer }
        top_k: { type: integer }
        trace_id: { type: string, nullable: true }
    IngestLogsRequest:
      type: object
      required: [lines]
      properties:
        lines: { type: array, items: { type: string }, description: "raw log lines (JSON objects or plain text)" }
        default_level: { type: string, description: "level for lines with no detectable level (default INFO)" }
        ttl_secs: { type: integer, description: "if set, each record gets _expires_at = now + ttl_secs" }

paths:
  /v1/admin/health:
    get:
      summary: Health probe.
      description: Always 200; payload describes per-subsystem health.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /v1/admin/readiness:
    get:
      summary: Readiness probe.
      description: 200 when healthy/degraded, 503 when unhealthy.
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: unhealthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /v1/auth/login:
    post:
      summary: Issue a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/nodes:
    get:
      summary: Cluster membership view.
      description: |
        In single-node mode, returns one entry describing this
        process. In Raft mode, returns one entry per voter from
        the Raft membership configuration; the responding node's
        entry has is_self=true and accurate uptime/shard counts.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListNodesResponse' }

  /v1/admin/metrics:
    get:
      summary: Prometheus metrics scrape.
      description: |
        Plain-text Prometheus exposition format. Includes
        Veda's request counters / latencies plus the Raft
        gauges (veda_raft_term / leader_id / last_applied_index
        / last_log_index / is_leader).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            text/plain: { schema: { type: string } }

  /v1/admin/cluster/join:
    post:
      summary: Add a voter to the Raft cluster.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, address]
              properties:
                node_id: { type: integer }
                address: { type: string }
      responses:
        '201': { description: voter added }
        '503': { description: raft not configured }

  /v1/admin/cluster/nodes/{id}:
    delete:
      summary: Remove a voter from the Raft cluster.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: voter removed }
        '503': { description: raft not configured }

  /v1/admin/cluster/noop:
    post:
      summary: Submit a Raft Noop command (debugging / load gen).
      security: [ { bearerAuth: [] } ]
      responses:
        '201': { description: committed }
        '503': { description: raft not configured }

  /v1/collections:
    get:
      summary: List collections on this node.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
    post:
      summary: Create a collection.
      description: |
        In Raft mode, this submits a `CreateCollection`
        command through the consensus log; the response only
        returns after the entry commits + applies on this node.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCollectionRequest' }
      responses:
        '201': { description: created }
        '307': { description: "follower; resubmit at Location header" }
        '409': { description: already exists }

  /v1/collections/{name}:
    get:
      summary: Describe a collection.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    delete:
      summary: Drop a collection.
      description: |
        Raft-routed in raft mode. Same 307 redirect behaviour on
        followers as POST /v1/collections.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: dropped }
        '307': { description: "follower; resubmit at Location header" }
        '404': { description: not found }

  /v1/collections/{name}/insert:
    post:
      summary: Insert one or more records.
      description: |
        Inserts records into the collection. Per-shard routing
        via ShardRouter. The response `ids` array contains the
        assigned UUID for each record.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsertRequest' }
      responses:
        '201':
          description: inserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsertResponse' }
        '307': { description: "follower; resubmit at Location header" }
        '404': { description: collection not found }

  /v1/collections/{name}/records/{id}:
    get:
      summary: Fetch a record by id.
      description: |
        Append `?linearisable=true` in raft mode to issue a
        `Noop` barrier write before reading from the Raft state
        machine instead of the local SegmentManager. One extra
        Raft round-trip; guarantees the response reflects every
        Insert that committed before this request arrived.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: linearisable
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: at
          required: false
          schema: { type: string }
          description: |
            MVCC snapshot timestamp. Same format as the search
            `?at=` parameter: raw u128 HLC or relative expression
            (`now`, `now-1h`, `now-30m`, `now-5s`).
      responses:
        '200': { description: ok }
        '404': { description: not found }

  /v1/collections/{name}/records:
    get:
      summary: List records in a collection.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: at
          required: false
          schema: { type: string }
          description: |
            MVCC snapshot timestamp. Same format as the search
            `?at=` parameter: raw u128 HLC or relative expression
            (`now`, `now-1h`, `now-30m`, `now-5s`).
      responses:
        '200': { description: ok }
    delete:
      summary: Delete records by filter.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/collections/{name}/ingest-logs:
    post:
      summary: Ingest raw log lines as records (searchable log archive).
      description: |
        Parses each line (JSON object or plain text) into a record with
        `message`, `level`, `ts` (+ optional `_expires_at` from `ttl_secs`),
        and inserts via the insert / embed-insert path (auto-embeds
        `message` when the collection has an `auto_embed` vector field).
        Recommended schema: `message` (string, bm25), `level` (string,
        filterable), `ts` (int64, filterable), optional `embedding`
        (vector, auto_embed source=message). Same auth/tenant as `/insert`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestLogsRequest' }
      responses:
        '201':
          description: ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested: { type: integer }
        '404': { description: collection not found }

  /v1/collections/{name}/search:
    post:
      summary: Search a collection.
      description: "Dense, sparse, BM25, match_phrase, hybrid, colpali, multi_vector. The scalar `filter` (and row-level security) applies to ALL paths including the lexical (BM25/match_phrase/hybrid) ones."
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: at
          required: false
          schema: { type: string }
          description: |
            MVCC snapshot timestamp. Accepts a raw u128 HLC value
            (encoding: `(physical_ns << 32) | logical`) or a relative
            expression: `now`, `now-1h`, `now-30m`, `now-5s`. When
            omitted, reads the latest committed state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }

  /v1/collections/{name}/coverage:
    get:
      summary: Coverage / orphan-chunk rollup.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, default: 7d, description: "1h|24h|7d|30d|<N><unit>" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageResponse' }

  /v1/embed:
    post:
      summary: Embed text or image to a vector.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/llm/complete:
    post:
      summary: OpenAI-compatible chat-completion proxy.
      description: |
        Used by the dashboard's cluster-labels, NL→DSL agent,
        and failure-mode classifier. Returns 503 when no LLM
        endpoint is configured.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
        '503': { description: LLM not configured }

  /v1/chunk/preview:
    post:
      summary: Compare chunking strategies on a single text.
      description: |
        Pure dry-run — no storage / no embedding. Used by the
        Chunker A/B page in Niriksha.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChunkPreviewRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkPreviewResponse' }
        '400': { description: invalid request }

  /v1/route:
    post:
      summary: Adaptive query router — recommends Dense / Sparse / BM25 / Hybrid.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/mcp:
    post:
      summary: Model Context Protocol endpoint (JSON-RPC 2.0, protocol 2025-06-18).
      description: |
        Stateless Streamable-HTTP MCP transport. Methods: `initialize`,
        `tools/list`, `tools/call`, `ping`. `tools/list` returns the full
        8-tool catalog with annotations; `tools/call` returns
        `structuredContent` on success and `isError: true` for tool-level
        errors. Honors the optional `MCP-Protocol-Version` header
        (unsupported value → 400). Desktop stdio clients connect via the
        `veda-mcp` bridge binary.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: header
          name: MCP-Protocol-Version
          required: false
          schema: { type: string, enum: ["2025-06-18", "2025-03-26"] }
      responses:
        '200': { description: JSON-RPC response (application/json) }
        '400': { description: unsupported MCP-Protocol-Version }
    get:
      summary: Not supported (no server-initiated stream).
      description: Veda's MCP server has no server→client stream; GET returns 405.
      security: [ { bearerAuth: [] } ]
      responses:
        '405': { description: "method not allowed (Allow: POST)" }

  /v1/agents:
    get:
      summary: List agents.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: Create or upsert an agent (empty id → generated).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        '200': { description: stored }

  /v1/agents/{id}:
    get:
      summary: Fetch an agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    put:
      summary: Upsert an agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        '200': { description: stored }
    delete:
      summary: Delete an agent.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/agents/{id}/converse:
    post:
      summary: Converse with an agent (sync multi-step tool-calling loop).
      description: |
        Runs the agent's ReAct-style loop over the configured LLM and
        returns the final answer plus a full `steps[]` trace. Resolves the
        built-in `veda-agent` when no agent with that id exists. Returns
        503 when no LLM endpoint is configured.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConverseRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConverseResponse' }
        '404': { description: agent not found }
        '503': { description: no LLM configured }

  /v1/agent-tools:
    get:
      summary: List user-defined custom tools.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: Create or upsert a custom tool.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTool' }
      responses:
        '200': { description: stored }

  /v1/agent-tools/catalog:
    get:
      summary: List built-in tool specs (id, description, inputSchema, annotations).
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/agent-tools/{id}:
    get:
      summary: Fetch a custom tool.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    put:
      summary: Upsert a custom tool.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTool' }
      responses:
        '200': { description: stored }
    delete:
      summary: Delete a custom tool.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/agent-tools/{id}/execute:
    post:
      summary: Invoke one built-in tool directly.
      description: |
        Body is the tool arguments, either wrapped as `{ "args": {...} }`
        or the args object directly. Tenant + RLS apply. Error mapping:
        invalid args → 400, not found → 404, internal → 500.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: tool result content }
        '400': { description: invalid args }
        '404': { description: tool or target not found }

  /v1/conversations:
    get:
      summary: List conversations.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/conversations/{id}:
    get:
      summary: Fetch a conversation (messages + step trace).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    delete:
      summary: Delete a conversation.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: removed }

  /v1/a2a/{agent_id}/card:
    get:
      summary: A2A AgentCard for discovery (skills = the agent's tools).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: agent_id, required: true, schema: { type: string } }
      responses:
        '200': { description: A2A AgentCard JSON }
        '404': { description: agent not found }

  /v1/a2a/{agent_id}:
    post:
      summary: A2A JSON-RPC endpoint (method message/send, sync).
      description: |
        Runs a one-shot agent turn over the user message's text parts and
        returns the agent's reply as an A2A Message. Unknown method → JSON-RPC
        -32601; no LLM → 503.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: agent_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "JSON-RPC 2.0 envelope with method message/send." }
      responses:
        '200': { description: JSON-RPC result (A2A Message) }
        '404': { description: agent not found }
        '503': { description: no LLM configured }

  /v1/saved_objects:
    get:
      summary: List server-side SavedObjects.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }

  /v1/admin/logs:
    get:
      summary: Recent captured logs from the in-process buffer (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: level, required: false, schema: { type: string, enum: [ERROR, WARN, INFO, DEBUG, TRACE] } }
        - { in: query, name: q, required: false, schema: { type: string, description: "substring filter over message + target" } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 200 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: { type: array, items: { $ref: '#/components/schemas/LogRecord' } }

  /v1/admin/logs/categories:
    get:
      summary: Semantic categories of recent WARN/ERROR logs (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { $ref: '#/components/schemas/LogCategory' } }

  /v1/admin/slow-queries:
    get:
      summary: Slowest recent queries, server-backed from the query log (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: query, name: collection, required: false, schema: { type: string, description: "omit to scan all tenant collections" } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  slow_queries: { type: array, items: { $ref: '#/components/schemas/SlowQuery' } }

  /v1/admin/insights:
    get:
      summary: List open ops-advisor events (admin-only).
      description: |
        Open events from the advisor, sorted by severity. Optional
        `?severity=` and `?scope=` filters. Each event has a severity
        (high/medium/low), root-cause detail, and a recommendation.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: severity
          required: false
          schema: { type: string, enum: [high, medium, low] }
        - in: query
          name: scope
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/OpsEvent' }

  /v1/admin/insights/history:
    get:
      summary: List closed ops-advisor events (admin-only, bounded).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/OpsEvent' }

  /v1/admin/insights/rules:
    get:
      summary: List the rule catalog with effective config (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: "each item: { id, default_severity?, anomaly, effective_config }"

  /v1/admin/insights/rules/{id}:
    put:
      summary: Tune a rule (admin-only).
      description: |
        Partial update: any of `enabled`, `muted`, `severity_override`,
        `thresholds` (object), `auto_remediate`. Persisted; returns the
        effective config.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleConfigUpdate' }
      responses:
        '200': { description: effective config }

  /v1/admin/insights/channels:
    get:
      summary: Alert-channel config, secrets redacted (admin-only).
      description: "Returns per-channel { configured, enabled, min_severity } (+ non-secret email bits). Secrets (urls/keys/passwords) are never returned."
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: redacted channel config }
    put:
      summary: Set alert-channel config (admin-only; secrets write-only).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelsConfig' }
      responses:
        '200': { description: stored }

  /v1/admin/insights/run:
    post:
      summary: Force one advisor evaluation tick (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened: { type: integer }
                  closed: { type: integer }

  /v1/admin/insights/{event_id}/ack:
    post:
      summary: Acknowledge an open event (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
      responses:
        '200': { description: acknowledged }
        '404': { description: no such open event }

  /v1/admin/jobs:
    get:
      summary: List scheduled jobs (admin-only).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/JobResponse' }
    post:
      summary: Register or overwrite a scheduled job (admin-only).
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '201': { description: registered }
        '400': { description: invalid cron expression }

  /v1/admin/jobs/{name}:
    delete:
      summary: Remove a scheduled job by name (admin-only).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '204': { description: removed }
        '404': { description: not found }

  /v1/collections/{name}/aggregate:
    get:
      summary: Scalar aggregation over a field, with optional grouping.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: field
          required: true
          schema: { type: string }
        - in: query
          name: metric
          required: true
          schema: { type: string, enum: [count, sum, avg, min, max] }
        - in: query
          name: group_by
          required: false
          schema: { type: string }
        - in: query
          name: filter
          required: false
          schema: { type: string, description: "SQL-like filter DSL (RLS-injected when configured)." }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateResponse' }
        '400': { description: "non-numeric field for a numeric metric, or invalid filter" }
        '404': { description: collection not found }

  /v1/collections/{name}/histogram:
    get:
      summary: Equal-width numeric histogram over a field.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: field
          required: true
          schema: { type: string }
        - in: query
          name: bins
          required: false
          schema: { type: integer, default: 10 }
        - in: query
          name: filter
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistogramResponse' }
        '404': { description: collection not found }

  /v1/collections/{name}/field-stats:
    get:
      summary: Per-field statistics (counts, cardinality, numeric/string summaries).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: field
          required: true
          schema: { type: string }
        - in: query
          name: filter
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldStatsResponse' }
        '404': { description: collection not found }

  /v1/saved_objects/{id}:
    put:
      summary: Upsert a SavedObject (search, atlas, eval, dashboard, ...).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: stored }
        '400': { description: bad request }
    delete:
      summary: Delete a SavedObject (idempotent).
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: removed }
